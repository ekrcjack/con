<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生活日語會話一本搞定 · 互動學習</title>
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#334155;
  --accent:#38bdf8; --accent2:#818cf8; --pink:#f472b6;
  --text:#e2e8f0; --muted:#94a3b8; --line:#334155;
  --a:#38bdf8; --b:#a78bfa; --c:#fb7185;
  --card:#1e293b; --hover:#2d3b52;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Hiragino Sans','Noto Sans TC','Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%);
  color:var(--text);min-height:100vh;
}
.wrap{max-width:1180px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
header{
  padding:20px 24px;text-align:center;
  background:linear-gradient(120deg,#38bdf8 0%,#818cf8 55%,#f472b6 100%);
  color:#0f172a;position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.4);
}
header h1{font-size:1.5em;font-weight:800;letter-spacing:.5px;}
header p{font-size:.85em;opacity:.85;margin-top:3px;font-weight:600;}
.layout{display:flex;flex:1;min-height:0;}
/* 側欄 */
.sidebar{
  width:220px;background:rgba(15,23,42,.6);backdrop-filter:blur(8px);
  border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px;flex-shrink:0;
}
.side-title{font-size:.72em;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:6px 10px;font-weight:700;}
.unit-btn{
  display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;margin:3px 0;
  text-align:left;border:none;background:transparent;color:var(--text);cursor:pointer;
  border-radius:10px;transition:all .18s;font-size:.9em;font-weight:600;
}
.unit-btn:hover{background:var(--hover);}
.unit-btn.active{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#0f172a;box-shadow:0 3px 12px rgba(56,189,248,.35);}
.unit-num{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:26px;height:26px;border-radius:8px;background:rgba(148,163,184,.2);
  font-weight:800;font-size:.82em;flex-shrink:0;
}
.unit-btn.active .unit-num{background:rgba(15,23,42,.25);}
/* 主內容 */
.main{flex:1;overflow-y:auto;padding:26px 30px 60px;}
.unit-head{margin-bottom:24px;padding-bottom:18px;border-bottom:2px solid var(--line);}
.unit-head h2{font-size:1.9em;font-weight:800;background:linear-gradient(120deg,var(--accent),var(--pink));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.unit-head .jp{font-size:1em;color:var(--accent2);margin-top:4px;font-weight:600;}
.unit-head .theme{font-size:.9em;color:var(--muted);margin-top:8px;}
.scene{
  background:var(--card);border-radius:16px;padding:20px 22px;margin-bottom:20px;
  border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.2);
}
.scene-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.scene-badge{
  display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:9px;background:linear-gradient(120deg,var(--accent2),var(--pink));
  color:#0f172a;font-weight:800;font-size:.9em;flex-shrink:0;
}
.scene-title{font-size:1.05em;font-weight:700;color:var(--text);}
.line{
  display:flex;gap:12px;padding:12px 0;border-top:1px solid rgba(51,65,85,.5);
}
.line:first-of-type{border-top:none;}
.spk{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;font-weight:800;font-size:.85em;flex-shrink:0;
  color:#0f172a;
}
.spk.A{background:var(--a);}
.spk.B{background:var(--b);}
.spk.C,.spk.E,.spk.R,.spk.S,.spk.K,.spk.Y,.spk.W{background:var(--c);}
.line-body{flex:1;min-width:0;}
.jp-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px;}
.jp-text{font-size:1.15em;font-weight:600;line-height:1.5;color:#f1f5f9;flex:1;}
.romaji{font-size:.88em;color:var(--accent);font-style:italic;margin-bottom:3px;line-height:1.4;}
.zh{font-size:.92em;color:var(--muted);line-height:1.4;}
.gram{
  margin-top:6px;padding:5px 0 5px 10px;border-left:2px solid var(--accent2);
  font-size:.85em;color:#a5b4fc;line-height:1.55;
}
.gram b{color:#c7d2fe;font-weight:700;}
.play{
  flex-shrink:0;width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(120deg,var(--accent),var(--accent2));color:#0f172a;
  display:inline-flex;align-items:center;justify-content:center;font-size:.9em;
  transition:transform .15s,box-shadow .15s;
}
.play:hover{transform:scale(1.12);box-shadow:0 3px 12px rgba(56,189,248,.5);}
.play:active{transform:scale(.95);}
.play.playing{background:linear-gradient(120deg,var(--pink),#ef4444);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
/* 播放整個場景 */
.scene-play{
  margin-left:auto;padding:6px 14px;border-radius:20px;border:none;cursor:pointer;
  background:rgba(56,189,248,.15);color:var(--accent);font-weight:700;font-size:.8em;
  display:inline-flex;align-items:center;gap:5px;transition:all .15s;
}
.scene-play:hover{background:rgba(56,189,248,.3);}
/* 控制列 */
.controls{
  position:sticky;bottom:0;background:rgba(15,23,42,.92);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;
  justify-content:center;gap:18px;flex-wrap:wrap;z-index:40;
}
.speed{display:flex;align-items:center;gap:10px;font-size:.85em;color:var(--muted);font-weight:600;}
.speed input{width:120px;accent-color:var(--accent);}
.speed .val{color:var(--accent);font-weight:800;min-width:36px;}
.cbtn{
  padding:8px 18px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:.85em;
  background:var(--panel2);color:var(--text);transition:all .15s;
}
.cbtn:hover{background:var(--hover);}
.cbtn.stop{background:rgba(251,113,133,.2);color:var(--pink);}
/* 進度 */
.progress-hint{font-size:.8em;color:var(--muted);text-align:center;padding:4px;}
/* 手機 */
@media(max-width:820px){
  .layout{flex-direction:column;}
  .sidebar{
    width:100%;border-right:none;border-bottom:1px solid var(--line);
    display:flex;overflow-x:auto;overflow-y:hidden;padding:10px;gap:6px;
  }
  .side-title{display:none;}
  .unit-btn{flex-direction:column;gap:4px;min-width:64px;padding:8px 6px;font-size:.62em;text-align:center;}
  .unit-btn .unit-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px;}
  .main{padding:18px 16px 40px;}
  .unit-head h2{font-size:1.4em;}
  header h1{font-size:1.15em;}
  .jp-text{font-size:1.05em;}
  .controls{gap:10px;padding:10px;}
  .speed input{width:90px;}
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent2);}
</style>
</head>

<div class="wrap">

<script>
const DATA = {"1":{"title":"問候","jp_title":"あいさつ","theme":"日常問候與禮儀用語","scenes":[{"name":"互相碰面時","lines":[["A","やあ、陽子。元気？","Yaa, Yōko. Genki?","嗨！陽子，你好嗎？","<b>やあ</b>：男性間隨性的招呼。<b>元気？</b>是「元気ですか」省略「です・か」，靠句尾升調表疑問，只用於熟人。"],["B","元気よ。あなたは？","Genki yo. Anata wa?","我很好，你呢？","<b>よ</b>：終助詞，向對方告知、語氣柔和（女性常用）。<b>あなたは？</b>省略後半，用「は」把話題丟回對方。"],["A","絶好調さ。","Zekkōchō sa.","再好不過了！","<b>さ</b>：男性用終助詞，輕鬆隨口的斷定。絶好調＝狀況好到極點。"]]},{"name":"早上問候","lines":[["A","おはよう、紀之。","Ohayō, Noriyuki.","早啊，紀之。","<b>おはよう</b>：「おはようございます」的常體，只對平輩、晚輩或家人使用。"],["B","やあ、いい日だね。","Yaa, ii hi da ne.","哈囉，天氣真好啊！不是嗎？","<b>いい日だね</b>：名詞句常體「だ」＋<b>ね</b>（尋求對方同意）。對上司要說「いい日ですね」。"],["A","本当だね。","Hontō da ne.","是啊！","<b>本当だね</b>：名詞＋だね，附和前一句的固定說法。"]]},{"name":"詢問近況","lines":[["A","元気？","Genki?","過得如何？","<b>元気？</b>：省略「ですか」，僅靠升調發問。最短的問候形式。"],["B","うん、ありがとう。君は？","Un, arigatō. Kimi wa?","很好，謝謝。你呢？","<b>うん</b>＝「はい」的常體。<b>君</b>：男性對平輩、晚輩的稱呼，比「あなた」親近。"],["A","元気だよ。","Genki da yo.","我很好。","<b>だよ</b>：常體斷定「だ」＋告知語氣「よ」。"]]},{"name":"詢問近況（普通）","lines":[["A","調子はどうだい？","Chōshi wa dō dai?","過得如何？","<b>調子</b>＝狀況。<b>〜かい／だい</b>：男性用的常體疑問句尾，接名詞・な形容詞時用「だい」。"],["B","まあまあだよ。君は？","Maa maa da yo. Kimi wa?","普普通通啦！你呢？","<b>まあまあ</b>：副詞，「馬馬虎虎、還可以」。這裡當名詞用，後接「だ」。"],["A","まあまあさ。","Maa maa sa.","還可以啦。","<b>さ</b>：男性終助詞，帶點無所謂的語氣。"]]},{"name":"晚上問候","lines":[["A","こんばんは、久美子。","Konbanwa, Kumiko.","晚安！久美子。","<b>こんばんは</b>：晚間問候，句尾的「は」讀作 wa（原為主題助詞的殘留）。"],["B","こんばんは、莉莉。きれいなドレスね。","Konbanwa, Riri. Kirei na doresu ne.","晚安，莉莉。你的晚禮服好漂亮。","<b>きれいなドレス</b>：な形容詞修飾名詞要加<b>な</b>。句尾<b>ね</b>表示感嘆與徵求同意。"],["A","ありがとう。","Arigatō.","謝謝。","<b>ありがとう</b>：「ありがとうございます」的常體，對平輩以下使用。"]]},{"name":"久別重逢","lines":[["A","会えてうれしいよ、健一郎。","Aete ureshii yo, Kenichirō.","健一郎，見到你真高興。","<b>会えて</b>：会う的可能形「会える」＋て形，表原因「因為能見到你」。後接感情形容詞是常見組合。"],["B","久しぶりだね。","Hisashiburi da ne.","好久不見了。","<b>久しぶり</b>＋<b>だね</b>：久違重逢的固定寒暄。禮貌說法為「お久しぶりですね」。"],["A","どうしてた？","Dō shiteta?","過得如何？","<b>どうしてた？</b>：「どうしていた」的縮約形（い脫落），過去進行式，問這陣子過得如何。"],["B","元気だったよ。","Genki datta yo.","我很好。","<b>だった</b>：常體斷定「だ」的過去式。禮貌形為「元気でした」。"]]},{"name":"道別（1）","lines":[["A","さようなら。","Sayōnara.","再見。","<b>さようなら</b>：正式或較長時間分別時的道別，日常朋友間反而少用。"],["B","またね。","Mata ne.","改天見。","<b>またね</b>：「また会おうね」的省略，輕鬆的道別。"]]},{"name":"道別（2）","lines":[["A","じゃあね。火曜日にまた。","Jā ne. Kayōbi ni mata.","拜拜！星期二見。","<b>じゃあ</b>＝「では」的口語形。<b>火曜日に</b>：具體時間點用助詞<b>に</b>標示。"],["B","うん。元気でね。","Un. Genki de ne.","好，要保重喔。","<b>元気で</b>：な形容詞的て形，表「保持健康的狀態」，道別時的祝福語。"]]},{"name":"道別（3）","lines":[["A","ええと、もう行かなくては。","Ēto, mō ikanakute wa.","呃，我該走了。","<b>ええと</b>：想事情時的填補詞。<b>行かなくては</b>是「行かなくてはいけない」省略後半，表「非做不可」。"],["B","ああそう。じゃあね。","Ā sō. Jā ne.","啊這樣。那再見。","<b>ああそう</b>：接受、理解對方所說的應答詞。"],["A","さようなら。元気でね。","Sayōnara. Genki de ne.","再見。要保重。","<b>元気でね</b>：「元気で」＋ね，道別時叮嚀對方保重。"]]},{"name":"道別（4）","lines":[["A","ああ、もうこんな時間だ！もう行かなくては。","Ā, mō konna jikan da! Mō ikanakute wa.","哎呀！這麼晚了。我該走了。","<b>こんな時間</b>：こんな＋名詞「這樣的〜」。<b>もう</b>表「已經」，句尾「だ！」為感嘆。"],["B","お話できてたのしかったです。元気でね。","Ohanashi dekite tanoshikatta desu. Genki de ne.","跟你聊天真是愉快。要保重啊。","<b>お話できて</b>：お＋動詞ます形＋できる，謙讓語的可能形。<b>たのしかった</b>是い形容詞的過去式（〜い→〜かった）。"],["A","おやすみなさい。また会いましょう。","Oyasuminasai. Mata aimashō.","晚安。改天再見囉！","<b>ましょう</b>：意向形，提議「一起〜吧」。おやすみなさい用於睡前或夜晚道別。"]]},{"name":"道別（5）","lines":[["A","よい週末を。","Yoi shūmatsu wo.","週末愉快！","<b>よい週末を</b>：「よい週末をお過ごしください」的省略，助詞「を」後面的動詞省略不說。"],["B","ありがとう。君もね。","Arigatō. Kimi mo ne.","謝謝。你也一樣。","<b>君もね</b>：助詞<b>も</b>表「也一樣」，回敬對方的祝福。"],["A","紀之によろしく。","Noriyuki ni yoroshiku.","代我向紀之問好。","<b>〜によろしく</b>：對象用<b>に</b>標示，後面的「伝えてください」省略。"],["B","オーケー。わかった。","Ōkē. Wakatta.","好，沒問題。","<b>わかった</b>：わかる的過去式，表示「（現在）明白了」，日文用過去式表達理解成立。"]]},{"name":"初次見面（1）","lines":[["A","こんにちは。私の名前は渡辺春男です。","Konnichiwa. Watashi no namae wa Watanabe Haruo desu.","你好，我叫渡邊春男。","<b>私の名前</b>：<b>の</b>表所屬。<b>は</b>提示主題，<b>です</b>為禮貌的斷定。"],["B","こんにちは。私は陳淑恵です。","Konnichiwa. Watashi wa Chin Shukukei desu.","你好，我叫陳淑惠。","<b>私は〜です</b>：最基本的自我介紹句型，比「私の名前は〜」更簡潔。"],["A","はじめまして。","Hajimemashite.","初次見面。","<b>はじめまして</b>：初次見面的固定招呼，由「初めて」變化而來。"],["B","お会いできてうれしいです。","Oai dekite ureshii desu.","很高興認識你。","<b>お会いできて</b>：会う的謙讓語「お会いする」的可能形＋て形，表原因，是最有禮貌的初次見面說法。"]]},{"name":"初次見面（2）","lines":[["A","私の名前は小林君枝です。","Watashi no namae wa Kobayashi Kimie desu.","我叫小林君枝。","<b>私の名前は〜です</b>：正式場合的自我介紹句型。"],["B","お会いできてうれしいです。私は王莉莉です。","Oai dekite ureshii desu. Watashi wa Ō Riri desu.","很高興認識你。我叫王莉莉。","先答謝再自報姓名，是日語自我介紹的常見順序。"],["A","お会いできてうれしいです。","Oai dekite ureshii desu.","很高興認識你。","對方說了同樣的話後，回以相同句子表示對等的敬意。"]]},{"name":"初次見面（3）","lines":[["A","こんにちは、ぼくの名前は張建邦です。","Konnichiwa, boku no namae wa Chō Kenpō desu.","你好，我叫張建邦。","<b>ぼく</b>：男性第一人稱，比「私」隨性，用於平輩或非正式場合。"],["B","こんにちは。私は木村春子です。","Konnichiwa. Watashi wa Kimura Haruko desu.","你好，我叫木村春子。","<b>私</b>：男女皆可用的第一人稱，正式場合的標準選擇。"],["A","会えてうれしいです。","Aete ureshii desu.","很高興認識你。","<b>会えて</b>：可能形「会える」的て形。比「お会いできて」隨意一些。"]]},{"name":"初次見面（4）","lines":[["A","井上が姓です。井上俊成です。","Inoue ga sei desu. Inoue Toshinari desu.","我姓井上。井上俊成。","<b>井上が姓です</b>：用<b>が</b>（而非は）提示新資訊，強調「井上才是姓」。"],["B","初めまして。李大成です。","Hajimemashite. Ri Taisei desu.","初次見面。我叫李大成。","<b>初めまして</b>後直接接姓名，是初次見面最精簡的自我介紹。"],["A","李さん、お会いできてうれしいです。","Ri-san, oai dekite ureshii desu.","李先生，很高興認識你。","<b>李さん</b>：姓＋さん的尊稱，不可對自己使用。先叫對方名字再說感想，更顯親切。"]]},{"name":"初次見面（5）","lines":[["A","莉莉、お会いできてよかったわ。","Riri, oai dekite yokatta wa.","莉莉，能認識你真好。","<b>よかった</b>：いい的過去式（不規則：いい→よかった）。句尾<b>わ</b>為女性用終助詞。"],["B","きみえ、たのしかったわ。","Kimie, tanoshikatta wa.","君枝，很愉快。","<b>たのしかった</b>：い形容詞過去式＋女性終助詞<b>わ</b>，柔和地表達感想。"],["A","また会いましょう。","Mata aimashō.","改天再見。","<b>会いましょう</b>：ます形＋ましょう，提議「再見面吧」。"]]}]},"2":{"title":"紹介","jp_title":"しょうかい","theme":"自我介紹和介紹他人","scenes":[{"name":"向朋友介紹他人","lines":[["A","莉莉、こちらは斎藤恵美さんです。私の東京の友達です。","Riri, kochira wa Saitō Emi-san desu. Watashi no Tōkyō no tomodachi desu.","莉莉，這位是齊藤惠美小姐，她是我在東京的朋友。","<b>こちらは〜です</b>：介紹第三者的固定句型。用「こちら」代替「この人」較有禮貌。"],["A","恵美、こちらは王莉莉さん、私の親友です。","Emi, kochira wa Ō Riri-san, watashi no shin'yū desu.","惠美，這位是王莉莉小姐，是我的好友。","介紹雙方時各說一次「こちらは〜」，是標準的引見流程。<b>親友</b>＝摯友。"],["E","まあ、お会いできてうれしいです。","Maa, oai dekite ureshii desu.","哦！真高興見到你。","<b>まあ</b>：女性用的感嘆詞，表驚喜。後接「お会いできてうれしいです」為固定套語。"],["R","こちらこそ、恵美さん。","Kochira koso, Emi-san.","我也是，惠美。","<b>こちらこそ</b>：<b>こそ</b>強調「我才是（該這麼說的一方）」，回應對方的客套。"]]},{"name":"介紹（正式）","lines":[["A","淑恵、島田靖子さんを紹介します。靖子、こちらは陳淑恵さんです。","Shukukei, Shimada Yasuko-san wo shōkai shimasu. Yasuko, kochira wa Chin Shukukei-san desu.","淑惠，我來介紹島田靖子小姐。靖子，這位是陳淑惠小姐。","<b>〜を紹介します</b>：介紹的對象用<b>を</b>標示。更禮貌可說「ご紹介します」。"],["S","初めまして。","Hajimemashite.","你好。","<b>初めまして</b>：漢字寫法與「はじめまして」相同，正式場合常用漢字。"],["K","お会いできてうれしいです。","Oai dekite ureshii desu.","很高興認識你。","<b>お会いできて</b>＋うれしいです：商務場合初次見面的標準回應。"]]},{"name":"介紹（3）","lines":[["A","陽子、蔡美鈴さんを紹介します。美鈴、こちらは村上陽子さんです。","Yōko, Sai Birei-san wo shōkai shimasu. Birei, kochira wa Murakami Yōko-san desu.","陽子，我來跟你介紹蔡美鈴小姐。美鈴，這是村上陽子小姐。","<b>〜さんを紹介します</b>後，再用「こちらは〜です」介紹另一方，順序固定。"],["Y","お会いできてうれしいです。","Oai dekite ureshii desu.","很高興認識你。","回應介紹的標準敬語句型。"],["S","光栄です。","Kōei desu.","這是我的榮幸。","<b>光栄です</b>：名詞「光栄」＋です，比「うれしいです」更正式，用於地位較高的對象。"]]},{"name":"職場（1）","lines":[["A","お名前をうかがえますか？","Onamae wo ukagaemasu ka?","請問貴姓大名？","<b>うかがえますか</b>：伺う（謙讓語，這裡指「聽、請教」）的可能形＋か，非常禮貌的詢問方式。"],["B","李と申します。10時に鈴木さんと約束があります。","Ri to mōshimasu. Jū-ji ni Suzuki-san to yakusoku ga arimasu.","敝姓李。我和鈴木先生在10點有約。","<b>〜と申します</b>：「言う」的謙讓語，正式自我介紹。<b>〜と約束があります</b>：約定的對象用<b>と</b>。"]]},{"name":"職場（2）","lines":[["A","東販会社の張建邦と申します。山本さんと10時に約束してあります。","Tōhan-gaisha no Chō Kenpō to mōshimasu. Yamamoto-san to jū-ji ni yakusoku shite arimasu.","我是東販公司的張建邦。和山本先生約10點碰面。","<b>約束してあります</b>：<b>〜てある</b>表「事先做好並保持該狀態」，強調已安排妥當。"],["B","どうぞおかけください。ご来社の旨、山本さんに伝えます。","Dōzo okake kudasai. Goraisha no mune, Yamamoto-san ni tsutaemasu.","請坐一下，我去通知山本先生。","<b>おかけください</b>：お＋動詞ます形＋ください，尊敬語的請求。<b>〜の旨</b>為書面語，指「〜這件事」。"]]},{"name":"職場（3）","lines":[["A","山本さん、こちらは台湾の東販会社の林明徳さんです。林さん、こちらは敝社の部長の、山本秀樹です。","Yamamoto-san, kochira wa Taiwan no Tōhan-gaisha no Rin Meitoku-san desu. Rin-san, kochira wa heisha no buchō no, Yamamoto Hideki desu.","山本先生，這位是臺灣東販公司的林明德先生。林先生，這位是敝公司的部長山本秀樹。","<b>部長の山本秀樹</b>：職稱＋<b>の</b>＋姓名，同位語用法。對外提到自家人不加「さん」。"],["Y","初めまして、林さん。東京にようこそ。","Hajimemashite, Rin-san. Tōkyō ni yōkoso.","林先生，幸會，歡迎蒞臨東京。","<b>ようこそ</b>：歡迎詞，後面常接「〜へようこそ」或直接單用。"],["R","山本さん、お会いできて光栄です。","Yamamoto-san, oai dekite kōei desu.","山本先生，能夠認識你，榮幸之至。","<b>お会いできて光栄です</b>：對地位高者的最高禮貌表達。"]]},{"name":"職場（4）","lines":[["A","紀之、こちらは大阪のABCエンジニアリングの若林禎彦さんです。若林さん、こちらは人事部長の神田紀之です。","Noriyuki, kochira wa Ōsaka no ABC enjiniaringu no Wakabayashi Yoshihiko-san desu. Wakabayashi-san, kochira wa jinji-buchō no Kanda Noriyuki desu.","紀之，這位是大阪ABC工程公司的若林禎彥先生。若林先生，這位是人事經理神田紀之先生。","介紹外部人士給自己人時，先介紹外部人士的公司與姓名，再介紹自家人的職稱。"],["K","若林さん、お会いできてうれしいです。","Wakabayashi-san, oai dekite ureshii desu.","若林先生，很高興認識你。","對外部人士使用「〜さん」，這是稱呼的基本原則。"],["W","神田さん、お会いできて光栄です。","Kanda-san, oai dekite kōei desu.","神田先生，能夠認識你是我的榮幸。","<b>光栄です</b>比「うれしいです」正式，適合對職位較高者。"]]},{"name":"自我介紹（1）","lines":[["A","私は遠藤文子です。京都出身で、京都大学で経済を勉強しています。好きなスポーツはボーリングとテニスです。","Watashi wa Endō Fumiko desu. Kyōto shusshin de, Kyōto daigaku de keizai wo benkyō shite imasu. Suki na supōtsu wa bōringu to tenisu desu.","我是遠藤文子。京都人，在京都大學唸經濟。喜歡的運動是保齡球和網球。","<b>京都出身で</b>：<b>で</b>是「です」的中止形，用來連接下一句。<b>〜で勉強しています</b>：場所用で，ています表現在持續的狀態。"]]},{"name":"自我介紹（2）","lines":[["A","私は渡辺春男です。こんなにたくさんのすてきな新入社員のみなさんにお会いできてうれしいです。ようこそ！私は3年前に北海道大学を卒業し、現在はABC社の販売部に属しています。趣味はスキーと釣りです。","Watashi wa Watanabe Haruo desu. Konna ni takusan no suteki na shinnyū shain no minasan ni oai dekite ureshii desu. Yōkoso! Watashi wa san-nen mae ni Hokkaidō daigaku wo sotsugyō shi, genzai wa ABC-sha no hanbai-bu ni zoku shite imasu. Shumi wa sukī to tsuri desu.","我是渡邊春男。能認識這麼多優秀的新進員工真高興。歡迎！我三年前從北海道大學畢業，現在在ABC公司的銷售部。興趣是滑雪和釣魚。","<b>こんなにたくさんの〜</b>：こんなに修飾數量。<b>卒業し</b>是ます形去掉ます的中止形（書面・正式）。<b>〜に属しています</b>：所屬單位用に。"]]},{"name":"自我介紹（3）","lines":[["A","自己紹介をさせていただきます。田中尚美です。東京の明治大学の2年生です。経済学部で勉強しています。会計学科でいい先生が大勢いるので満足です。私は公認会計士になりたいのです。","Jiko shōkai wo sasete itadakimasu. Tanaka Naomi desu. Tōkyō no Meiji daigaku no ni-nensei desu. Keizai gakubu de benkyō shite imasu. Kaikei gakka de ii sensei ga ōzei iru node manzoku desu. Watashi wa kōnin kaikeishi ni naritai no desu.","請容我自我介紹。我是田中尚美。東京明治大學二年級。在經濟學部唸書。會計學科有很多好老師，我很滿意。我想成為公認會計師。","<b>〜させていただきます</b>：使役形＋いただく，最謙遜的「請容我〜」。<b>〜たいのです</b>：希望「たい」＋のです，補充說明自己的意願。"]]}]},"3":{"title":"和陌生人的談話","jp_title":"見知らぬ人に話しかける","theme":"與陌生人的基本交流","scenes":[{"name":"問路（1）","lines":[["A","ちょっと失礼します。新宿通りはどこか教えていただけますか？","Chotto shitsurei shimasu. Shinjuku-dōri wa doko ka oshiete itadakemasu ka?","對不起，請問一下新宿街怎麼走？","<b>〜ていただけますか</b>：「〜てもらう」的謙讓＋可能形，非常客氣的請求。<b>どこか</b>：疑問詞＋か，變成名詞子句當「教える」的內容。"],["B","すみません。このあたりはあまり詳しくありません。","Sumimasen. Kono atari wa amari kuwashiku arimasen.","抱歉，我對這附近也不熟。","<b>あまり〜ありません</b>：あまり必須與否定呼應，表「不太〜」。<b>詳しい</b>＝熟悉、精通。"],["A","ああ、そうですか。","Ā, sō desu ka.","哦，這樣子啊！","<b>そうですか</b>：降調時表「原來如此」的理解，升調則變成反問。"]]},{"name":"問路（2）","lines":[["A","失礼ですが、アメリカ大使館はどこかご存じですか？","Shitsurei desu ga, Amerika taishikan wa doko ka gozonji desu ka?","對不起，請問美國大使館在哪裡？","<b>失礼ですが</b>：向陌生人搭話的緩衝語。<b>ご存じですか</b>：「知っている」的尊敬語。"],["B","ええ、まっすぐ行ってください。ほんの2ブロック先です。","Ē, massugu itte kudasai. Honno ni-burokku saki desu.","嗯，請直走，就在隔兩條街的地方。","<b>〜てください</b>：て形＋ください，指示或請求。<b>ほんの</b>＝只不過，強調距離很近。"],["A","ありがとうございました。","Arigatō gozaimashita.","謝謝！","<b>ありがとうございました</b>：過去式表示事情已結束，對已完成的幫助道謝。"]]},{"name":"提醒","lines":[["A","あのー、ハンカチを落としましたよ。","Anō, hankachi wo otoshimashita yo.","那個，你的手帕掉了。","<b>あのー</b>：向人搭話時的緩衝詞。<b>落としましたよ</b>：<b>よ</b>用於告知對方不知道的資訊。"],["B","あら、どうもすみません。","Ara, dōmo sumimasen.","真是謝謝你。","<b>あら</b>：女性用的驚訝感嘆詞。<b>どうもすみません</b>：這裡的すみません表達謝意而非道歉。"]]},{"name":"座位（1）","lines":[["A","この席はどなたかいらっしゃいますか。","Kono seki wa donata ka irasshaimasu ka.","這個位子有人坐嗎？","<b>どなたか</b>：「誰か」的敬語形。<b>いらっしゃいます</b>：「いる」的尊敬語。"],["B","いいえ。どうぞ。","Iie. Dōzo.","沒有，請坐。","<b>どうぞ</b>：勸讓對方使用或進行動作，後面的動詞省略。"],["A","ありがとう。","Arigatō.","謝謝！","<b>ありがとう</b>：常體，用於輕微的道謝或熟人之間。"]]},{"name":"座位（2）","lines":[["A","すみませんが、ここは私の席です。","Sumimasen ga, koko wa watashi no seki desu.","對不起，這是我的位子。","<b>すみませんが</b>：<b>が</b>是緩衝用的接續助詞，並無逆接意味，讓後續的主張顯得委婉。"],["B","ああ、すみません。","Ā, sumimasen.","啊，對不起！","<b>ああ、すみません</b>：發現自己弄錯時的道歉，「ああ」表示恍然。"]]},{"name":"餐廳（1）","lines":[["A","ウェーターさん。","Wētā-san.","服務生。","<b>ウェーターさん</b>：職業名＋さん，用來稱呼服務人員。"],["B","はい、お客さま。","Hai, okyakusama.","您好，客人。","<b>お客さま</b>：「客」加上接頭辭「お」與最高級敬稱「さま」。"],["A","メニューを見せていただけませんか？","Menyū wo misete itadakemasen ka?","可以給我看菜單嗎？","<b>〜ていただけませんか</b>：否定疑問形的請求，比「〜ていただけますか」更客氣。"]]},{"name":"餐廳（2）","lines":[["A","ウェーターさん。","Wētā-san.","服務生！","呼喚服務生時直接以職稱＋さん，不使用「あなた」。"],["B","いらっしゃいませ。","Irasshaimase.","歡迎光臨！","<b>いらっしゃいませ</b>：「いらっしゃる」的命令形，店家迎客的固定用語，不需回應。"],["A","注文をとっていただけますか？","Chūmon wo totte itadakemasu ka?","可以幫我點菜嗎？","<b>注文をとる</b>＝點餐（受理訂單）。<b>〜ていただけますか</b>為客氣的請求。"]]},{"name":"購物（1）","lines":[["A","すみませんが。","Sumimasen ga.","對不起。","<b>すみませんが</b>：句子只說一半，靠<b>が</b>留白讓對方接話，是很日式的搭話方式。"],["B","はい。何がよろしいでしょうか？","Hai. Nani ga yoroshii deshō ka?","您好，需要什麼嗎？","<b>よろしい</b>：「いい」的鄭重說法。<b>でしょうか</b>降低斷定，顯得客氣。"],["A","シルクのブラウスを見たいのですが。","Shiruku no burausu wo mitai no desu ga.","我想看看絲質的罩衫。","<b>〜たいのですが</b>：希望助動詞「たい」＋のですが，說出願望後留白，等待對方回應。"]]},{"name":"購物（2）","lines":[["A","すみません。","Sumimasen.","對不起。","<b>すみません</b>：可用於道歉、道謝、搭話三種場合，這裡是搭話。"],["B","はい。何かご用でしょうか？","Hai. Nani ka goyō deshō ka?","您好，需要什麼嗎？","<b>何かご用でしょうか</b>：<b>ご用</b>為「用事」的尊敬語，<b>でしょうか</b>比「ですか」更委婉。"],["A","黒のカーディガンはありますか？","Kuro no kādigan wa arimasu ka?","有黑色的毛線衣嗎？","<b>〜はありますか</b>：詢問店家是否有某商品的基本句型。<b>黒の</b>：名詞＋の修飾名詞。"]]},{"name":"購物（3）","lines":[["A","すみませんが。","Sumimasen ga.","對不起。","<b>すみませんが</b>：向店員搭話的標準開場。"],["B","はい。何かご用でしょうか？","Hai. Nani ka goyō deshō ka?","您好，需要什麼嗎？","店員回應顧客招呼的固定說法。"],["A","このセーターでLサイズはありますか？","Kono sētā de L saizu wa arimasu ka?","這件毛衣有沒有L size的？","<b>このセーターで</b>：<b>で</b>表範圍「就這件毛衣而言」。詢問尺寸的實用句型。"]]}]},"4":{"title":"再次確認","jp_title":"聞き返す","theme":"信息確認與澄清","scenes":[{"name":"再問一次（1）","lines":[["A","すみませんが、もう一度お願いします。","Sumimasen ga, mō ichido onegai shimasu.","對不起，請再說一遍。","<b>もう一度お願いします</b>：お＋名詞＋します，最簡短的請求說法。"],["B","上野公園はどちらか教えていただけますか。","Ueno kōen wa dochira ka oshiete itadakemasu ka.","能告訴我上野公園在哪裡嗎？","<b>どちら</b>：「どこ」的禮貌形。<b>〜か教えていただけますか</b>：疑問句嵌入成名詞子句。"],["A","ああ、いいですよ。まっすぐ行ってください。","Ā, ii desu yo. Massugu itte kudasai.","啊，好的，請直走。","<b>いいですよ</b>：答應對方請求。<b>まっすぐ行ってください</b>為指路的基本句。"]]},{"name":"再問一次（2）","lines":[["A","すみませんが、何とおっしゃいましたか？","Sumimasen ga, nan to osshaimashita ka?","對不起，你說什麼？","<b>おっしゃる</b>：「言う」的尊敬語。<b>何と</b>：引用內容用<b>と</b>標示。"],["B","お母さんはいかがですか。","Okāsan wa ikaga desu ka.","你母親好嗎？","<b>いかがですか</b>：「どうですか」的禮貌形，問候他人近況。"],["A","ああ、母は先週退院いたしまして、元気です。","Ā, haha wa senshū taiin itashimashite, genki desu.","啊，我母親上個禮拜出院了，她很好。","<b>いたしまして</b>：「する」的謙讓語「いたす」的て形。談自己的母親時不加「お」。"]]},{"name":"再問一次（3）","lines":[["A","圭子、もう一度言ってくれる？","Keiko, mō ichido itte kureru?","圭子，再說一遍好嗎？","<b>〜てくれる？</b>：「〜てくれますか」的常體，向熟人請求。"],["B","次の週末の予定を聞いてたのよ。","Tsugi no shūmatsu no yotei wo kiiteta no yo.","我是問你下週末有什麼計畫。","<b>聞いてた</b>＝「聞いていた」的縮約。<b>のよ</b>：女性用的說明語氣。"],["A","ああ、別に決まっていないけど。何か考えがあるの？","Ā, betsu ni kimatte inai kedo. Nani ka kangae ga aru no?","啊，還沒決定，你有什麼想法嗎？","<b>別に〜ない</b>：呼應否定，表「並沒有特別〜」。<b>〜の？</b>：常體的疑問語氣。"]]},{"name":"再問一次（4）","lines":[["A","あなたのおっしゃったことが聞き取れなかったのですが。もう少しゆっくり話してくださいませんか？","Anata no osshatta koto ga kikitorenakatta no desu ga. Mō sukoshi yukkuri hanashite kudasaimasen ka?","我聽不清楚你說的話，能不能再說慢一點呢？","<b>聞き取れなかった</b>：複合動詞「聞き取る」的可能形否定過去。<b>〜てくださいませんか</b>為極客氣的請求。"],["B","いいですよ。いいながめですね、と言いました。","Ii desu yo. Ii nagame desu ne, to iimashita.","好的，我說『視野真好啊』。","<b>〜と言いました</b>：引用內容＋と＋言う，直接引述自己剛才的話。"]]},{"name":"確認姓名（1）","lines":[["A","あなたの姓をもう一度おっしゃってくださいませんか？","Anata no sei wo mō ichido osshatte kudasaimasen ka?","請再一次告訴我你的姓好嗎？","<b>おっしゃってくださいませんか</b>：尊敬語て形＋くださいませんか，最高禮貌的請求。"],["B","はい、古川と申します。","Hai, Furukawa to mōshimasu.","好的，我姓古川。","<b>〜と申します</b>：「言う」的謙讓語，報上自己姓名。"],["A","古川さんですね。どうもありがとうございます。","Furukawa-san desu ne. Dōmo arigatō gozaimasu.","古川先生，謝謝你。","<b>〜ですね</b>：<b>ね</b>用於向對方確認自己聽到的內容是否正確。"]]},{"name":"確認姓名（2）","lines":[["A","私の名前は若林禎彦です。","Watashi no namae wa Wakabayashi Yoshihiko desu.","我的名字叫若林禎彥。","<b>私の名前は〜です</b>：介紹全名的基本句型。"],["B","ええと……禎彦、何さんですか？","Ēto…… Yoshihiko, nan-san desu ka?","嗯，是……禎彥先生嗎？那姓什麼？","<b>ええと</b>：思考中的填補詞。<b>何さん</b>：不知道姓氏時，用疑問詞「何」＋さん詢問。"],["A","若林。若林禎彦です。","Wakabayashi. Wakabayashi Yoshihiko desu.","若林，是若林禎彥。","先單說姓氏再說全名，是澄清姓名時的常見做法。"]]},{"name":"確認地點","lines":[["A","私は東京の高田馬場駅の近くに住んでいます。","Watashi wa Tōkyō no Takadanobaba-eki no chikaku ni sunde imasu.","我住在東京的高田馬場車站附近。","<b>〜に住んでいます</b>：居住地用<b>に</b>，ています表持續的狀態而非進行中的動作。"],["B","どちらに住んでいるんですか？","Dochira ni sunde iru n desu ka?","你剛說你住在哪裡？","<b>〜んですか</b>：「のですか」的口語，帶有「我想確認、我很在意」的語氣。"],["A","高田馬場駅の近くです。東京にあります。","Takadanobaba-eki no chikaku desu. Tōkyō ni arimasu.","高田馬場車站的附近。在東京。","<b>〜にあります</b>：無生命物體的存在用「ある」，場所用<b>に</b>標示。"],["B","ああ、そうですか！","Ā, sō desu ka!","啊，是這樣啊！","<b>そうですか</b>：加上感嘆語氣「！」表示恍然大悟。"]]},{"name":"確認詞義（1）","lines":[["A","「スト」とはどういう意味ですか？","'Suto' to wa dō iu imi desu ka?","「スト」是什麼意思？","<b>〜とはどういう意味ですか</b>：詢問字詞意義的固定句型，<b>とは</b>提示被定義的對象。"],["B","英語で「ストライキ」のことです。","Eigo de 'sutoraiki' no koto desu.","是英文『strike（罷工）』的意思。","<b>〜のことです</b>：說明「指的就是〜」。<b>英語で</b>：<b>で</b>表手段、語言。"],["A","ああ、わかりました。","Ā, wakarimashita.","啊，我明白了。","<b>わかりました</b>：過去式表示「（此刻）理解了」，日語習慣用過去式表達理解成立。"]]},{"name":"確認詞義（2）","lines":[["A","もし質問がありましたら、紀之に聞いてください。彼は我々のプロです。","Moshi shitsumon ga arimashitara, Noriyuki ni kiite kudasai. Kare wa wareware no puro desu.","如果有問題的話，請教紀之，他是我們的專家（puro）。","<b>もし〜ましたら</b>：もし與條件形「たら」呼應，假設語氣更明確。<b>我々</b>為「私たち」的鄭重說法。"],["B","すみません、「プロ」とはどういう意味ですか？","Sumimasen, 'puro' to wa dō iu imi desu ka?","對不起，puro是什麼意思？","聽到不懂的外來語縮略詞時，用「〜とはどういう意味ですか」詢問最為自然。"],["A","「専門家」ということです。","'Senmonka' to iu koto desu.","就是「專家」的意思。","<b>〜ということです</b>：說明語意內容「就是〜的意思」。"]]}]},"5":{"title":"致謝","jp_title":"お礼を言う","theme":"感謝與答謝的表達","scenes":[{"name":"感謝幫忙（1）","lines":[["A","お手伝っていただき、ありがとうございました。","Otetsudatte itadaki, arigatō gozaimashita.","謝謝您的幫忙。","<b>〜ていただき</b>：「〜ていただいて」的鄭重中止形，用於正式道謝。"],["B","どういたしまして。","Dō itashimashite.","不客氣。","<b>どういたしまして</b>：回應道謝的固定語，字面為「我做了什麼呢（沒什麼）」。"]]},{"name":"感謝幫忙（2）","lines":[["A","きのうは手伝っていただいて、ありがとうございました。","Kinō wa tetsudatte itadaite, arigatō gozaimashita.","多謝你昨天的幫忙。","<b>〜ていただいて、ありがとうございました</b>：說明感謝的原因，比單說謝謝更具體。"],["B","どういたしまして。お手伝いができてうれしいです。","Dō itashimashite. Otetsudai ga dekite ureshii desu.","不客氣，很高興能夠幫得上忙。","<b>お手伝いができて</b>：お＋名詞＋ができる，謙讓表達「能夠幫上忙」。"]]},{"name":"感謝支持","lines":[["A","慈善バザーでお手伝いしていただきまして、本当にありがとうございました。","Jizen bazā de otetsudai shite itadakimashite, hontō ni arigatō gozaimashita.","慈善義賣的事真的很謝謝你的幫忙。","<b>〜ていただきまして</b>：ます形的て形，比「〜ていただいて」更鄭重。"],["B","たいしたことないですよ。私も楽しかったです。","Taishita koto nai desu yo. Watashi mo tanoshikatta desu.","沒什麼啦，我也很開心。","<b>たいしたことない</b>：謙虛地表示「沒什麼大不了」，是回應感謝的客套。"],["A","本当にありがとうございました。","Hontō ni arigatō gozaimashita.","真的很謝謝你。","<b>本当に</b>：副詞，加強「ありがとうございました」的誠意。"]]},{"name":"感謝送車","lines":[["A","健一郎、乗せてくれてありがとう。","Kenichirō, nosete kurete arigatō.","健一郎，謝謝你載我一程。","<b>〜てくれて</b>：對方為自己做了某事，て形接ありがとう說明感謝的內容。"],["B","たいしたことないさ。役に立ててうれしいよ。","Taishita koto nai sa. Yaku ni tatete ureshii yo.","那沒什麼，很高興能幫得上忙。","<b>役に立てて</b>：「役に立つ」的可能形て形。句尾<b>さ・よ</b>為男性的隨性語氣。"]]}]},"6":{"title":"表現好惡","jp_title":"好き嫌いを言う","theme":"表達喜歡和討厭","scenes":[{"name":"詢問喜好（運動）","lines":[["A","スポーツは好きですか？","Supōtsu wa suki desu ka?","你喜歡運動嗎？","<b>〜が好きですか</b>：好き是な形容詞，喜歡的對象用<b>が</b>而非を。"],["B","ええ。とくに団体競技が好きです。野球やバスケットボールが一番好きです。","Ē. Toku ni dantai kyōgi ga suki desu. Yakyū ya basukettobōru ga ichiban suki desu.","喜歡，尤其是團體運動。我最喜歡棒球和籃球。","<b>とくに</b>＝尤其。<b>や</b>：列舉代表性的例子（相對於「と」的全部列舉）。"]]},{"name":"詢問喜好（足球）","lines":[["A","どんなスポーツが好きですか？","Donna supōtsu ga suki desu ka?","你喜歡什麼運動？","<b>どんな＋名詞</b>：詢問種類、性質「什麼樣的〜」。"],["B","フットボールを見るのが好きですが、他のスポーツには興味がありません。","Futtobōru wo miru no ga suki desu ga, hoka no supōtsu ni wa kyōmi ga arimasen.","我喜歡看足球，其他運動就沒什麼興趣。","<b>見るのが好き</b>：動詞＋<b>の</b>名詞化後才能當「好き」的對象。<b>〜には</b>：に＋は表對比。"]]},{"name":"詢問喜好（音樂）","lines":[["A","どんな音楽が好きですか？","Donna ongaku ga suki desu ka?","你喜歡什麼音樂？","<b>どんな音楽</b>：詢問偏好類型的常用問法。"],["B","ジャズが大好きです。","Jazu ga daisuki desu.","我最喜歡爵士樂。","<b>大好き</b>：好き加上接頭辭「大」，程度更強。"],["A","私もです。高校時代からジャズのCDを集めています。","Watashi mo desu. Kōkō jidai kara jazu no CD wo atsumete imasu.","我也是。從高中開始我就一直在收集爵士樂的CD。","<b>私もです</b>：省略述語，用<b>も</b>表示相同。<b>〜から〜ています</b>：起點用から，ています表持續至今。"]]},{"name":"食物喜好","lines":[["A","イタリア料理は好きですか？","Itaria ryōri wa suki desu ka?","你喜歡義大利菜嗎？","<b>〜は好きですか</b>：用<b>は</b>提示話題，詢問對特定事物的喜好。"],["B","大好きです。","Daisuki desu.","很喜歡啊！","<b>大好きです</b>：省略主語，只回答程度。"],["A","じゃあ夕食は「ナポリ」に行きましょう。","Jā yūshoku wa 'Napori' ni ikimashō.","那麼晚餐就去「拿波里」吃吧！","<b>じゃあ</b>：承接前言做出結論。<b>〜に行きましょう</b>：目的地用に，ましょう表提議。"]]},{"name":"電影喜好","lines":[["A","私は映画が大好きです。毎週映画館に見に行きます。","Watashi wa eiga ga daisuki desu. Maishū eigakan ni mi ni ikimasu.","我最喜歡看電影。每個禮拜都會去電影院看。","<b>見に行きます</b>：動詞ます形＋<b>に</b>＋行く，表移動的目的。"],["B","まあ！私も映画が好きです。でも、私は家でビデオを見るんです。","Maa! Watashi mo eiga ga suki desu. Demo, watashi wa ie de bideo wo miru n desu.","嗯！我也喜歡看電影。但是我都在家裡看錄影帶。","<b>でも</b>：句首的逆接。<b>〜んです</b>：說明自己的情況，帶有補充解釋的語氣。"],["A","そう、私は映画館で見る方が好きですね。","Sō, watashi wa eigakan de miru hō ga suki desu ne.","喔，我比較喜歡到電影院看。","<b>〜方が好き</b>：<b>ほう</b>用於兩者比較時表明偏好。"]]}]},"7":{"title":"表達需求及希望","jp_title":"欲求・希望の言い方","theme":"表達欲求、願望和需要","scenes":[{"name":"想喝東西","lines":[["A","ああ、のどがかわいた。何か冷たい物がほしいな。","Ā, nodo ga kawaita. Nani ka tsumetai mono ga hoshii na.","啊，口好渴，真想喝個涼的啊！","<b>のどがかわいた</b>：慣用表現，主語用が，過去式表現在的狀態。<b>〜がほしい</b>：想要之物用が。<b>な</b>為自言自語的語氣。"],["B","オレンジジュースはどう？","Orenji jūsu wa dō?","來杯柳橙汁怎麼樣？","<b>〜はどう？</b>：「どうですか」的常體，提出建議。"],["A","はい、いただきます。","Hai, itadakimasu.","好，謝謝。","<b>いただきます</b>：「もらう・食べる・飲む」的謙讓語，接受他人給予時使用（用餐前也說這句）。"]]},{"name":"想吃東西","lines":[["A","夕食、何がいいですか？","Yūshoku, nani ga ii desu ka?","晚餐吃什麼好呢？","<b>何がいいですか</b>：徵詢意見時用<b>が</b>提示疑問詞，不可用は。"],["B","ピザが食べたい気分です。","Piza ga tabetai kibun desu.","我想吃披薩。","<b>〜たい気分です</b>：たい形＋気分，比直接說「食べたい」更含蓄。"],["A","じゃあ、イタリア料理の店に行きましょう。","Jā, Itaria ryōri no mise ni ikimashō.","那我們去吃義大利料理！","<b>じゃあ</b>承接結論，<b>〜に行きましょう</b>提議一起前往。"]]},{"name":"點餐","lines":[["A","ご注文はお決まりですか。","Gochūmon wa okimari desu ka.","決定好要點什麼了嗎？","<b>お決まりですか</b>：お＋動詞ます形＋です，尊敬語的狀態表現，店員常用。"],["B","はい。オニオンスープとステーキディナーをお願いします。","Hai. Onion sūpu to sutēki dinā wo onegai shimasu.","是的，我要洋蔥湯和牛排。","<b>〜をお願いします</b>：點餐、委託的萬用句型。<b>と</b>用於並列名詞。"],["A","オニオンスープとステーキディナーですね。かしこまりました。","Onion sūpu to sutēki dinā desu ne. Kashikomarimashita.","洋蔥湯和牛排。好的。","<b>〜ですね</b>複誦確認。<b>かしこまりました</b>：「わかりました」的最高敬語，服務業專用。"]]},{"name":"加點","lines":[["A","他に何かいりますか。","Hoka ni nani ka irimasu ka.","其他還需要些什麼嗎？","<b>他に何か</b>：不確定的事物用「何か」。<b>いる</b>＝需要，用が標示需要的東西。"],["B","はい、デザートをお願いします。","Hai, dezāto wo onegai shimasu.","是的，我要點心。","<b>〜をお願いします</b>：追加點單的說法。"],["A","こちらがメニューです。","Kochira ga menyū desu.","請看菜單。","<b>こちらが〜です</b>：<b>が</b>提示新出現的事物，服務業遞東西時的固定說法。"]]},{"name":"訂位","lines":[["A","いらっしゃいませ。","Irasshaimase.","歡迎光臨。","<b>いらっしゃいませ</b>：店家迎客語，不需回應。"],["B","予約をしたはずなのですが。","Yoyaku wo shita hazu na no desu ga.","我應該有訂位。","<b>〜はずなのですが</b>：「はず」表理應如此，句尾用が留白，暗示與現況有落差。"],["A","はい、こちらへどうぞ。","Hai, kochira e dōzo.","好的，這邊請。","<b>こちらへどうぞ</b>：方向用<b>へ</b>，後面的「お越しください」省略。"]]},{"name":"願望（未來志向）","lines":[["A","大きくなったら何になりたいの？","Ōkiku nattara nani ni naritai no?","你長大了想做什麼？","<b>大きくなったら</b>：い形容詞副詞形「大きく」＋なる＋たら條件。<b>〜になりたい</b>：變化的結果用に。"],["B","レーサーになりたいです。","Rēsā ni naritai desu.","想當一名賽車手。","<b>〜になりたいです</b>：職業志願的標準說法。"]]},{"name":"願望（今天）","lines":[["A","今日は何をしたいの？","Kyō wa nani wo shitai no?","今天想做什麼？","<b>何をしたいの？</b>：常體疑問「の」，語氣柔和，親近的人之間使用。"],["B","釣りに行こうかと思っていたんだ。一緒に行かない。","Tsuri ni ikō ka to omotte ita n da. Issho ni ikanai.","想去釣魚。要一起去嗎？","<b>〜（よ）うかと思っていた</b>：意向形＋かと思う，表原本的打算。<b>行かない？</b>：否定疑問形用來邀約。"],["A","おもしろそうだね。","Omoshirosō da ne.","好像很有趣呢！","<b>おもしろそう</b>：い形容詞去い＋そう，表示外觀上的推測「看起來〜」。"]]},{"name":"願望（考試）","lines":[["A","東京大学の入学試験に受かればいいなあ。","Tōkyō daigaku no nyūgaku shiken ni ukareba ii nā.","希望能通過東京大學的入學考試。","<b>〜ばいいなあ</b>：假定形「ば」＋いい＋なあ，表達願望「要是〜就好了」。"],["B","僕もさ。","Boku mo sa.","我也是。","<b>僕もさ</b>：省略述語，「も」表同樣，「さ」為男性語氣。"]]},{"name":"願望（旅行）","lines":[["A","この夏、外国旅行ができたらなあ。","Kono natsu, gaikoku ryokō ga dekitara nā.","今年夏天，如果能去國外旅行就好了。","<b>〜たらなあ</b>：條件形＋なあ，後半的「いい」省略，表達難以實現的願望。"],["B","どうかしたの？行けないわけでもあるの？","Dō ka shita no? Ikenai wake demo aru no?","怎麼了？有什麼原因不能去嗎？","<b>どうかしたの？</b>：關心對方異狀的固定問法。<b>〜わけでもあるの？</b>：追問是否有隱情。"],["A","祖父が病気で、母の手伝いをしなくちゃならないんだ。","Sofu ga byōki de, haha no tetsudai wo shinakucha naranai n da.","祖父生病了，必須要幫母親的忙。","<b>で</b>表原因（祖父生病）。<b>〜なくちゃならない</b>：「〜なくてはならない」的口語縮約，表義務。"]]},{"name":"願望（天氣）","lines":[["A","長雨だね。","Nagaame da ne.","一直下雨呢！","<b>長雨だね</b>：名詞＋だね，向對方確認共同的感受。"],["B","あした晴れるといいな。","Ashita hareru to ii na.","希望明天能放晴。","<b>〜といいな</b>：辭書形＋と＋いい，表達對未來的期望「要是〜就好了」。"]]},{"name":"願望（請求載送）","lines":[["A","ビーチまで乗せていってもらえたらいいなあ。","Bīchi made nosete itte moraetara ii nā.","能不能載我去海邊？","<b>乗せていってもらえたら</b>：使役性的「乗せていく」＋てもらう的可能形＋たら，層層堆疊的委婉請求。"],["B","一緒においでよ。","Issho ni oide yo.","一起去吧！","<b>おいで</b>：「来る・行く」的親暱命令形，用於長輩對晚輩或熟人之間。"],["A","わあ、ありがとう。ちょっと持ち物を取ってくるね。","Wā, arigatō. Chotto mochimono wo totte kuru ne.","哇啊，謝謝。等一下，我拿個東西。","<b>取ってくる</b>：て形＋くる，表「去做某事再回來」。句尾<b>ね</b>柔化語氣。"]]},{"name":"願望（安慰）","lines":[["A","どうしてそんなにがっかりしているの？","Dō shite sonna ni gakkari shite iru no?","你看起來很沒精神，怎麼了嗎？","<b>そんなに</b>：指對方的狀態程度。<b>〜ているの？</b>：關心地詢問對方目前的狀況。"],["B","陽子が土曜日のテニスの試合を断ってきたばかりなの。本当に試合をしたかったのよ。","Yōko ga doyōbi no tenisu no shiai wo kotowatte kita bakari na no. Hontō ni shiai wo shitakatta no yo.","陽子剛拒絕了星期六的網球比賽。我真的很想比賽的。","<b>〜たばかり</b>：た形＋ばかり，表「剛剛才〜」。<b>のよ</b>為女性的說明語氣。"],["A","私が相手ではどう？","Watashi ga aite de wa dō?","我當你的對手如何？","<b>私が相手では</b>：<b>では</b>表「若以我為對手的話」，後接どう徵詢意見。"],["B","そうしてくれる？ほんとう？","Sō shite kureru? Hontō?","你願意嗎？真的？","<b>そうしてくれる？</b>：「〜てくれる」表對方為自己做，升調成為請求確認。"],["A","喜んで。何時にそこへ行ったらいい？","Yorokonde. Nanji ni soko e ittara ii?","樂意之至。幾點到那裡好？","<b>喜んで</b>：「喜んでします」的省略，爽快答應。<b>〜たらいい</b>：徵詢適當的做法。"]]}]},"8":{"title":"要求許可","jp_title":"許可を求める","theme":"徵求許可和詢問是否可以","scenes":[{"name":"請求許可（1）","lines":[["A","部屋から出てもよろしいですか？気分が悪いのです。","Heya kara dete mo yoroshii desu ka? Kibun ga warui no desu.","我可以到外面去嗎？我覺得有點不舒服。","<b>〜てもよろしいですか</b>：「〜てもいいですか」的敬語形，請求許可最禮貌的說法。"],["B","もちろんです。","Mochiron desu.","當然可以。","<b>もちろんです</b>：乾脆地許可，比「いいですよ」更肯定。"]]},{"name":"請求許可（2）","lines":[["A","お母さん、今晩車を借りてもいい？","Okāsan, konban kuruma wo karite mo ii?","媽媽，今天晚上車子借我開好嗎？","<b>〜てもいい？</b>：常體的請求許可，對家人朋友使用。"],["B","いいわよ。","Ii wa yo.","好啊。","<b>いいわよ</b>：<b>わ</b>為女性終助詞，加上よ表示明確給予許可。"]]},{"name":"請求許可（3）","lines":[["A","あなたの写真を撮らせてもらえますか？","Anata no shashin wo torasete moraemasu ka?","我可以幫你照張相嗎？","<b>〜させてもらえますか</b>：使役形＋てもらう的可能形，「請讓我〜」，比「〜てもいいですか」更謙遜。"],["B","どうぞ。","Dōzo.","請便。","<b>どうぞ</b>：單獨使用即表示許可。"]]},{"name":"請求許可（4）","lines":[["A","たばこを吸ってもかまいませんか？","Tabako wo sutte mo kamaimasen ka?","請問我可以抽煙嗎？","<b>〜てもかまいませんか</b>：「かまわない（不介意）」，語氣比「いいですか」更客氣。"],["B","ええ、いいですよ。","Ē, ii desu yo.","可以的。","<b>ええ</b>＝はい的口語。<b>いいですよ</b>給予許可。"]]},{"name":"請求許可（5）","lines":[["A","今夜美穂と映画に行ってもいい？","Kon'ya Miho to eiga ni itte mo ii?","今天晚上我可以跟美穗一起去看電影嗎？","<b>〜てもいい？</b>：向家長請求許可的常體說法。<b>と</b>表共同動作的對象。"],["B","宿題はすませたの？","Shukudai wa sumaseta no?","你功課寫好了嗎？","<b>すませたの？</b>：「済ませる」（他動詞，把事情做完）＋の的確認語氣。"],["A","うん。","Un.","寫好了。","<b>うん</b>：常體的肯定回應。"],["B","じゃあ、いいわ。","Jā, ii wa.","那就去吧。","<b>じゃあ、いいわ</b>：確認條件後給予許可，<b>わ</b>為女性語氣。"]]},{"name":"拒絕（1）","lines":[["A","先生、あした学校にもどってもいいでしょうか？","Sensei, ashita gakkō ni modotte mo ii deshō ka?","醫師，明天我可以回學校上課嗎？","<b>〜てもいいでしょうか</b>：用「でしょうか」降低斷定，比「いいですか」更委婉。"],["B","いいえ、もう1日寝ていなさい。","Iie, mō ichinichi nete inasai.","不行，你得在床上多休息一天。","<b>寝ていなさい</b>：「〜ている」＋なさい，長輩或專業人士對他人的溫和命令。"]]},{"name":"拒絕（2）","lines":[["A","先生、テストを受けてもよろしいですか？","Sensei, tesuto wo ukete mo yoroshii desu ka?","教授，我可以參加考試嗎？","<b>〜てもよろしいですか</b>：對老師、上位者請求許可的敬語形。"],["B","いいや、健一郎。あなたはテストをうけられません。授業のサボりすぎです。","Iiya, Kenichirō. Anata wa tesuto wo ukeraremasen. Jugyō no sabori sugi desu.","不行，健一郎。你沒有辦法參加考試。你曠課太多了。","<b>うけられません</b>：可能形的否定，表「無法、不被允許」。<b>サボりすぎ</b>：動詞ます形＋すぎ，表過度。"]]},{"name":"拒絕（3）","lines":[["A","先生、薬を飲んでから運転してもだいじょうぶでしょうか？","Sensei, kusuri wo nonde kara unten shite mo daijōbu deshō ka?","醫師，吃藥之後可以開車嗎？","<b>〜てから</b>：て形＋から，表動作的先後順序。<b>だいじょうぶでしょうか</b>委婉確認可否。"],["B","だめです。その薬を飲むと少し眠くなりますから、運転しないでください。","Dame desu. Sono kusuri wo nomu to sukoshi nemuku narimasu kara, unten shinaide kudasai.","不行，吃藥之後會有點想睡覺，所以請不要開車。","<b>〜と〜なります</b>：<b>と</b>表必然的因果。<b>〜ないでください</b>：否定的請求。"]]},{"name":"拒絕（4）","lines":[["A","たばこを吸ってもよろしいですか？","Tabako wo sutte mo yoroshii desu ka?","我可以抽煙嗎？","<b>〜てもよろしいですか</b>：在公共場合請求許可的禮貌問法。"],["B","吸わないでください。あそこに「禁煙」の表示があります。","Suwanaide kudasai. Asoko ni 'kin'en' no hyōji ga arimasu.","不行，那裡有「禁煙」的標示。","<b>吸わないでください</b>：直接的禁止請求，後面補上理由較不失禮。"]]}]},"9":{"title":"委託","jp_title":"依頼する","theme":"依賴、請求幫助和委託事項","scenes":[{"name":"請求幫忙（1）","lines":[["A","お願いがあるのですが。","Onegai ga aru no desu ga.","我有事想拜託你。","<b>お願いがあるのですが</b>：開口拜託前的鋪陳，用<b>が</b>留白等待對方回應。"],["B","はい、何でしょうか？","Hai, nan deshō ka?","好啊，什麼事呢？","<b>何でしょうか</b>：「何ですか」的委婉形，回應對方的鋪陳。"],["A","日本語のレポートを見てもらいたいのです。","Nihongo no repōto wo mite moraitai no desu.","可以請你幫我看一下日文報告嗎？","<b>〜てもらいたいのです</b>：「〜てもらう」＋たい，表希望對方為自己做某事。"]]},{"name":"請求載送","lines":[["A","空港まで乗せていただけますか？","Kūkō made nosete itadakemasu ka?","您可以送我到機場嗎？","<b>〜ていただけますか</b>：「〜てもらう」的謙讓可能形，最常用的客氣請求句型。"],["B","喜んで。","Yorokonde.","我很樂意。","<b>喜んで</b>：省略後續動詞，爽快答應的固定說法。"]]},{"name":"順路請求","lines":[["A","私を駅まで連れて行く前に、ちょっと家へ寄ってもいいですか。","Watashi wo eki made tsurete iku mae ni, chotto ie e yotte mo ii desu ka.","在載我去車站前，可以先回我家一下嗎？","<b>〜前に</b>：辭書形＋前に，表「在〜之前」，動詞必須用辭書形。<b>寄る</b>＝順道前往。"],["B","はい、分かりました。","Hai, wakarimashita.","好的，我知道了。","<b>分かりました</b>：接受請求的標準回應。"]]},{"name":"請求做菜","lines":[["A","チャリティーバザーのために何か料理をしてくださいませんか？","Charitī bazā no tame ni nani ka ryōri wo shite kudasaimasen ka?","可以請你幫慈善義賣做一些餐點嗎？","<b>〜のために</b>：表目的、受益對象。<b>〜てくださいませんか</b>：否定疑問的敬語請求，非常客氣。"],["B","喜んで。ストローベリーショートケーキを作りましょう。","Yorokonde. Sutorōberī shōto kēki wo tsukurimashō.","我很樂意。那我就來作草莓蛋糕吧！","<b>作りましょう</b>：ましょう在此表主動提出要做，而非邀約。"]]},{"name":"搬東西","lines":[["A","ちょっとこのテーブルに手を貸していただけますか？動かしたいのです。","Chotto kono tēburu ni te wo kashite itadakemasu ka? Ugokashitai no desu.","您可以幫我搬這張桌子嗎？我想把它換個位置。","<b>手を貸す</b>：慣用語「幫忙」。<b>動かしたいのです</b>：たい＋のです，說明請求的理由。"],["B","いいですよ。じゃあ、どこへ運びますか。","Ii desu yo. Jā, doko e hakobimasu ka.","當然。您要搬到哪裡呢？","<b>どこへ運びますか</b>：移動方向用<b>へ</b>，確認具體做法。"]]},{"name":"再次幫忙","lines":[["A","美穂、悪いんだけど、また手を貸してくれる？","Miho, warui n dakedo, mata te wo kashite kureru?","美穗，不好意思，可以再請你幫個忙嗎？","<b>悪いんだけど</b>：「不好意思」的口語緩衝。<b>〜てくれる？</b>：常體請求，對熟人使用。"],["B","いいわよ。どうすればいいの？","Ii wa yo. Dō sureba ii no?","好啊！要如何幫你呢？","<b>どうすればいいの？</b>：假定形「すれば」＋いい，詢問具體做法。"]]},{"name":"問路請求","lines":[["A","すみませんが、道をたずねたいのですが。","Sumimasen ga, michi wo tazunetai no desu ga.","對不起，可以跟你問個路嗎？","<b>〜たいのですが</b>：說出自己的希望後留白，讓對方主動接話，非常日式的請求方式。"],["B","いいですよ。どちらへ行きたいのですか？","Ii desu yo. Dochira e ikitai no desu ka?","好啊！你要去哪裡？","<b>どちらへ</b>：「どこへ」的禮貌形。<b>〜たいのですか</b>確認對方的希望。"],["A","新宿駅をさがしているのです。","Shinjuku-eki wo sagashite iru no desu.","我在找新宿車站。","<b>さがしているのです</b>：ている表持續動作，のです補充說明狀況。"]]},{"name":"請求寫信","lines":[["A","お願いしてもいいですか？","Onegai shite mo ii desu ka?","可以請你幫個忙嗎？","<b>お願いしてもいいですか</b>：把「請求」本身當成動作來徵求許可，是很禮貌的開場。"],["B","どうぞどうぞ。お手伝いできれば嬉しいですよ。","Dōzo dōzo. Otetsudai dekireba ureshii desu yo.","好啊！我很樂意能夠幫得上忙。","<b>どうぞどうぞ</b>：重複表示欣然接受。<b>〜できれば</b>：可能形的假定形。"],["A","じゃあ。この手紙を書くのを手伝ってくれますか？","Jā. Kono tegami wo kaku no wo tetsudatte kuremasu ka?","那麼可以幫我寫這封信嗎？","<b>書くのを手伝う</b>：動詞＋<b>の</b>名詞化後才能接助詞を。"]]},{"name":"請求建議","lines":[["A","陽子、ちょっとアドバイスがほしいんだけど。","Yōko, chotto adobaisu ga hoshii n dakedo.","陽子，您可以給我一些建議嗎？","<b>〜がほしいんだけど</b>：ほしい＋んだ＋けど，說出願望後用けど留白，等待對方回應。"],["B","私でよければね。何か知りたいの？","Watashi de yokereba ne. Nani ka shiritai no?","我很樂意。您想知道哪方面的事情呢？","<b>私でよければ</b>：<b>で</b>表資格「以我來說」＋よければ（いい的假定形），謙虛的答應方式。"],["A","北海道を旅行するにはどんな方法が一番いいかな？","Hokkaidō wo ryokō suru ni wa donna hōhō ga ichiban ii ka na?","到北海道旅行用什麼方式最好呢？","<b>〜には</b>：辭書形＋には，表目的「為了〜」。<b>〜かな</b>：自問自語式的疑問。"]]},{"name":"拒絕（1）","lines":[["A","お父さん、学校の劇には来てくれる？","Otōsan, gakkō no geki ni wa kite kureru?","爸爸，你會來看學校的話劇嗎？","<b>〜てくれる？</b>：請求對方為自己做某事，常體疑問。"],["B","行きたいけど、その日は大事な会議があるんだ。","Ikitai kedo, sono hi wa daiji na kaigi ga aru n da.","我想去，可是那天有重要的會議。","<b>〜たいけど</b>：先表達意願再用けど轉折，是委婉拒絕的典型結構。"]]},{"name":"拒絕（2）","lines":[["A","駅まで車で送りましょう。","Eki made kuruma de okurimashō.","我開車送你到車站吧。","<b>〜ましょう</b>：主動提出為對方做某事。<b>車で</b>：手段用<b>で</b>。"],["B","いいです。友達に頼んでますから。","Ii desu. Tomodachi ni tanonde masu kara.","不用了，我已經拜託朋友了。","<b>いいです</b>：這裡是婉拒（不用了），需靠語調與後續理由判斷。<b>〜から</b>說明原因。"]]},{"name":"拒絕（3）","lines":[["A","私の日本語の小論文に何かアドバイスをいただけますか？","Watashi no Nihongo no shōronbun ni nani ka adobaisu wo itadakemasu ka?","可以給我的日文小論文一些建議嗎？","<b>〜をいただけますか</b>：「もらう」的謙讓可能形，客氣地請求給予。"],["B","喜んでお手伝いしたいんですが。でも次の月曜日までには時間がありません。","Yorokonde otetsudai shitai n desu ga. Demo tsugi no getsuyōbi made ni wa jikan ga arimasen.","我很樂意幫忙。但是下星期一之前我沒時間。","<b>〜たいんですが。でも〜</b>：先表達意願、再說出困難，是拒絕時的標準流程。<b>までには</b>：期限用までに，加は強調。"]]}]},"10":{"title":"提議、邀請","jp_title":"提案・誘う","theme":"提案、邀請和建議","scenes":[{"name":"邀請打網球","lines":[["A","あしたテニスをしないか？","Ashita tenisu wo shinai ka?","明天要不要打網球？","<b>〜ないか？</b>：否定疑問形用來邀約，比「〜しよう」更留餘地。男性常體。"],["B","いいね。1時でいいかい？","Ii ne. Ichi-ji de ii kai?","好啊！1點可以嗎？","<b>〜でいいかい？</b>：<b>で</b>表「以這個條件」，かい為男性用的常體疑問。"],["A","いいよ。","Ii yo.","好的。","<b>いいよ</b>：答應邀約的常體回應。"]]},{"name":"邀請晚餐","lines":[["A","土曜日の晩、夕食に来ませんか？","Doyōbi no ban, yūshoku ni kimasen ka?","週末晚上要不要來吃晚餐？","<b>〜ませんか</b>：禮貌的邀約句型，用否定疑問表示不強迫。"],["B","いいですよ。何時にいけばいいですか？","Ii desu yo. Nanji ni ikeba ii desu ka?","好啊！什麼時候？","<b>いけばいいですか</b>：假定形＋いいですか，詢問「該怎麼做才好」。"],["A","6時ごろ来てください。","Roku-ji goro kite kudasai.","那就約六點吧。","<b>〜ごろ</b>：接時間點表大約（相對地，數量的大約用「ぐらい」）。"]]},{"name":"邀請午餐","lines":[["A","一緒にお昼を食べに行きませんか。","Issho ni ohiru wo tabe ni ikimasen ka.","中午要不要一起去吃飯？","<b>食べに行きませんか</b>：ます形＋に＋行く（目的），再用ませんか邀約。"],["B","もちろん。何時？","Mochiron. Nanji?","當然，什麼時候？","<b>もちろん</b>：爽快答應。<b>何時？</b>省略助詞，口語常見。"],["A","11時45分。ロビーで会おう。","Jūichi-ji yonjūgo-fun. Robī de aō.","11點45分。大廳見。","<b>会おう</b>：意向形，男性對平輩的提議「見面吧」。<b>で</b>表動作場所。"]]},{"name":"邀請購物","lines":[["A","きょうの午後、私と買い物に行きませんか？","Kyō no gogo, watashi to kaimono ni ikimasen ka?","今天下午要不要跟我一起去購物？","<b>私と</b>：<b>と</b>表共同行動的對象。<b>〜ませんか</b>禮貌邀約。"],["B","いいわよ。何時に出ますか？","Ii wa yo. Nanji ni demasu ka?","好啊！什麼時候？","<b>いいわよ</b>：女性的答應語氣。<b>出ます</b>＝出發。"],["A","昼食後、すぐに行きましょう。","Chūshoku go, sugu ni ikimashō.","吃完午飯後馬上去。","<b>昼食後</b>：名詞＋後。<b>すぐに</b>副詞，<b>行きましょう</b>提議。"]]},{"name":"提議導覽","lines":[["A","あした町をご案内しましょうか。","Ashita machi wo goannai shimashō ka.","明天帶你參觀一下這個都市吧！","<b>ご案内しましょうか</b>：ご＋漢語動詞＋する為謙讓語，＋ましょうか表主動提供服務。"],["B","ではお願いします。","De wa onegai shimasu.","那真是太好了。","<b>ではお願いします</b>：接受對方好意的固定說法。"],["A","10時ごろ出かけましょう。","Jū-ji goro dekakemashō.","那我們10點左右出發吧。","<b>出かけましょう</b>：ましょう表共同行動的提議。"]]},{"name":"提議載送","lines":[["A","駅までお乗りになりませんか？","Eki made onori ni narimasen ka?","要不要我載你到車站啊？","<b>お乗りになりませんか</b>：お＋ます形＋になる為尊敬語，＋ませんか客氣地邀請。"],["B","ありがとうございます。ちょうどバスに乗り遅れるところだったのです。","Arigatō gozaimasu. Chōdo basu ni noriokureru tokoro datta no desu.","太謝謝你了。差點就搭不上公車了。","<b>〜ところだった</b>：差一點就〜（實際上沒發生）。<b>乗り遅れる</b>＝沒趕上。"],["A","それはよかったです。","Sore wa yokatta desu.","很高興能幫你。","<b>それはよかったです</b>：對對方的好結果表示欣慰。"]]},{"name":"邀請晚餐（正式）","lines":[["A","こんどの日曜日に家族とあなたを夕食にお招きしたいのですが。おひまですか。","Kondo no nichiyōbi ni kazoku to anata wo yūshoku ni omaneki shitai no desu ga. Ohima desu ka.","這星期天我們家想請你吃晚飯。你有空嗎？","<b>お招きしたいのですが</b>：お＋ます形＋する（謙讓）＋たい＋が，最鄭重的邀請。<b>おひま</b>加お表尊敬。"],["B","はい、ぜひうかがいます。","Hai, zehi ukagaimasu.","有啊，我一定到。","<b>ぜひ</b>：與意志表現呼應，表強烈意願。<b>うかがいます</b>：「行く」的謙讓語。"],["A","それはよかった。6時30分にお待ちしております。","Sore wa yokatta. Roku-ji sanjuppun ni omachi shite orimasu.","那真是太好了。那就跟你約六點三十分。","<b>お待ちしております</b>：お＋ます形＋する的謙讓語＋ておる（いる的謙讓），最高級的鄭重表現。"]]},{"name":"邀請看展","lines":[["A","美術館でエジプト美術展があるんだけど。あした行かない。","Bijutsukan de Ejiputo bijutsuten ga aru n dakedo. Ashita ikanai.","美術館有個埃及藝術展。明天要不要去？","<b>〜があるんだけど</b>：先提供情報再用けど留白。<b>行かない？</b>否定疑問邀約。"],["B","あしたは都合が悪いな。あさってはどう？","Ashita wa tsugō ga warui na. Asatte wa dō?","明天不行。後天怎樣？","<b>都合が悪い</b>：委婉拒絕的固定說法（不直說理由）。<b>〜はどう？</b>提出替代方案。"],["A","ぼくはいいよ。","Boku wa ii yo.","沒問題。","<b>ぼくはいいよ</b>：<b>は</b>表對比「就我而言沒問題」。"]]},{"name":"提供腳踏車","lines":[["A","よければ、僕の自転車を使ってもいいよ。","Yokereba, boku no jitensha wo tsukatte mo ii yo.","如果可以的話，你用我的腳踏車也行。","<b>よければ</b>：いい的假定形，「如果你願意的話」。<b>〜てもいいよ</b>表許可、提供。"],["B","ほんとう？ありがとう。","Hontō? Arigatō.","真的？謝謝。","<b>ほんとう？</b>：升調表驚訝與確認。"],["A","どういたしまして。","Dō itashimashite.","不客氣。","<b>どういたしまして</b>：回應道謝的固定語。"]]},{"name":"拒絕邀請（1）","lines":[["A","今週末に映画に行こうよ。","Konshūmatsu ni eiga ni ikō yo.","這週末去看電影吧。","<b>行こうよ</b>：意向形＋よ，積極邀約「一起去吧」。"],["B","悪いだけど、行けないよ。試験勉強をしなくちゃ。","Warui dakedo, ikenai yo. Shiken benkyō wo shinakucha.","不好意思，我不能去。得準備考試。","<b>悪いけど</b>：拒絕前的緩衝。<b>〜なくちゃ</b>：「〜なくてはならない」的口語省略。"]]},{"name":"拒絕邀請（2）","lines":[["A","今晩ボーリングに行きませんか？","Konban bōringu ni ikimasen ka?","今晚要不要去打保齡球？","<b>〜ませんか</b>：禮貌的邀約。"],["B","誘ってくれてありがとう。でも今夜は遅くまで仕事です。","Sasotte kurete arigatō. Demo kon'ya wa osoku made shigoto desu.","謝謝你邀請。但是今晚要工作到很晚。","<b>誘ってくれてありがとう</b>：先謝再拒，是日語拒絕邀約的標準結構。<b>まで</b>表時間的終點。"]]},{"name":"拒絕邀請（3）","lines":[["A","仕事のあと、一杯どう？","Shigoto no ato, ippai dō?","下班後去喝一杯如何？","<b>一杯どう？</b>：省略動詞的口語邀約，「一杯」特指喝酒。"],["B","悪いんだけど、きょうはだめなんです。","Warui n dakedo, kyō wa dame na n desu.","不好意思，今天不行。","<b>だめなんです</b>：「だめだ」＋のです，說明狀況，比單說「だめです」柔和。"]]},{"name":"拒絕邀請（4）","lines":[["A","もう少しスープはどう？","Mō sukoshi sūpu wa dō?","再來點湯如何？","<b>もう少し〜はどう？</b>：勸食的固定說法。"],["B","けっこうです。ありがとう。もう十分です。","Kekkō desu. Arigatō. Mō jūbun desu.","不用了，謝謝。已經夠了。","<b>けっこうです</b>：這裡表婉拒「不用了」，需靠語調判斷；也可表「可以」。"]]}]},"11":{"title":"詢問預定事情及意圖","jp_title":"予定や意図をたずねる・言う","theme":"詢問計畫、日程和意圖","scenes":[{"name":"詢問休假計畫","lines":[["A","休みの計画はありますか？","Yasumi no keikaku wa arimasu ka?","你有休假的計畫嗎？","<b>〜はありますか</b>：詢問是否有計畫。「計画」是無生命名詞，用ある。"],["B","いいえ。忙しすぎて考える時間もないのです。","Iie. Isogashi sugite kangaeru jikan mo nai no desu.","沒有。我忙得連想的時間都沒有。","<b>忙しすぎて</b>：い形去い＋すぎる＋て形表原因。<b>も</b>強調「連〜都沒有」。"]]},{"name":"詢問去處","lines":[["A","休み中にどこかへお出かけですか？","Yasumi-chū ni doko ka e odekake desu ka?","休假有想要去哪裡嗎？","<b>どこかへ</b>：不特定場所用「どこか」。<b>お出かけですか</b>：お＋ます形＋です，尊敬語。"],["B","ええ。友達2、3人と北海道をサイクリングでまわるつもりです。","Ē. Tomodachi ni-san-nin to Hokkaidō wo saikuringu de mawaru tsumori desu.","是的。我要和二、三個朋友到北海道自行車旅遊。","<b>〜つもりです</b>：表事先的打算、意圖。<b>で</b>表手段（用自行車）。"]]},{"name":"詢問暑假","lines":[["A","夏休み中に何をする予定ですか？","Natsuyasumi-chū ni nani wo suru yotei desu ka?","暑假你要作什麼？","<b>〜予定ですか</b>：詢問已排定的計畫，比「つもり」更確定。"],["B","アルバイトをする予定です。","Arubaito wo suru yotei desu.","我準備要去打工。","<b>〜予定です</b>：辭書形＋予定，表已安排好的行程。"]]},{"name":"詢問黃金週","lines":[["A","ゴールデンウィークの計画は何ですか？","Gōruden wīku no keikaku wa nan desu ka?","黃金週你有什麼計劃？","<b>計画は何ですか</b>：直接詢問內容。"],["B","家族でハワイへ行きます。","Kazoku de Hawai e ikimasu.","我們全家要去夏威夷。","<b>家族で</b>：<b>で</b>表以某群體為單位行動。<b>へ</b>表方向。"]]},{"name":"詢問出發","lines":[["A","いつハワイへ行くのですか？","Itsu Hawai e iku no desu ka?","你們什麼時候要去夏威夷？","<b>〜のですか</b>：帶有關心、想深入了解的語氣，比「行きますか」更自然。"],["B","あしたの午後3時30分の飛行機です。","Ashita no gogo san-ji sanjuppun no hikōki desu.","明天下午3:30的飛機。","<b>〜の飛行機です</b>：省略動詞，用名詞句回答時間。"],["A","では、朝のうちに家を出なくてはなりませんね。","De wa, asa no uchi ni ie wo denakute wa narimasen ne.","那你們不就早上就要出門？","<b>朝のうちに</b>：〜のうちに表「趁著〜的期間」。<b>〜なくてはなりません</b>表義務。"],["B","そうです。10時に出ようと思っています。","Sō desu. Jū-ji ni deyō to omotte imasu.","對啊，我們計劃10點就要出門。","<b>〜（よ）うと思っています</b>：意向形＋と思っている，表持續抱持的打算，比「思います」更確定。"]]},{"name":"詢問夏天計畫","lines":[["A","今年の夏はどこにも行く予定はないよ。働くつもり。","Kotoshi no natsu wa doko ni mo iku yotei wa nai yo. Hataraku tsumori.","這個夏天我什麼地方也不去。我要工作。","<b>どこにも〜ない</b>：疑問詞＋にも＋否定，表全面否定。<b>つもり</b>表打算。"],["B","どうして？","Dō shite?","為什麼？","<b>どうして？</b>：常體的原因詢問。"],["A","冬休みにスキーに行きたいんだ。たくさんお金がかかるからね。","Fuyuyasumi ni sukī ni ikitai n da. Takusan okane ga kakaru kara ne.","我想在寒假時去滑雪，必須花很多錢。","<b>〜たいんだ</b>：たい＋のだ，說明理由。<b>から</b>表原因，句尾ね尋求理解。"]]},{"name":"詢問將來計畫","lines":[["A","将来の計画はどうですか？","Shōrai no keikaku wa dō desu ka?","對於未來你有什麼計劃？","<b>〜はどうですか</b>：徵詢對方的想法或狀況。"],["B","良い会社に就職して、自分の才能を発揮したいです。","Yoi kaisha ni shūshoku shite, jibun no sainō wo hakki shitai desu.","我想進一家能夠發揮自己才能的好公司。","<b>就職して</b>：て形連接兩個動作。<b>〜たいです</b>表希望。"]]},{"name":"詢問週末","lines":[["A","週末は勉強をしなくちゃならないんだ。君は？","Shūmatsu wa benkyō wo shinakucha naranai n da. Kimi wa?","這個週末我要唸書，你呢？","<b>〜なくちゃならない</b>：口語的義務表現。<b>君は？</b>用は把話題丟回對方。"],["B","僕は京都へ行くよ。","Boku wa Kyōto e iku yo.","我要去京都。","<b>僕は〜よ</b>：<b>は</b>表對比（相對於你），<b>よ</b>告知自己的預定。"]]}]},"12":{"title":"詢問理由及目的","jp_title":"理由や目的をたずねる・答える","theme":"詢問原因、目的和為什麼","scenes":[{"name":"詢問開快車","lines":[["A","どうしてそんなにスピードを出していたのですか？","Dō shite sonna ni supīdo wo dashite ita no desu ka?","你為什麼開車開那麼快？","<b>どうして〜のですか</b>：詢問理由時加「のです」，語氣才不會太生硬。<b>スピードを出す</b>＝加速。"],["B","2時20分に空港で上司を出迎えなくてはならないのです。","Ni-ji nijuppun ni kūkō de jōshi wo demukaenakute wa naranai no desu.","我必須在2點20到機場去接我老闆。","<b>〜なくてはならないのです</b>：義務表現＋のです，用來說明理由。"]]},{"name":"詢問缺席","lines":[["A","14日のスピーチコンテストには来られますか？","Jūyokka no supīchi kontesuto ni wa koraremasu ka?","十四號你能來看演講比賽嗎？","<b>来られますか</b>：「来る」的可能形，詢問對方能否前來。<b>には</b>：に＋は，強調該時間點。"],["B","悪いけど、用事があります。","Warui kedo, yōji ga arimasu.","抱歉，我另外有事。","<b>悪いけど</b>＋<b>用事があります</b>：不明說內容的婉拒方式。"]]},{"name":"詢問反對","lines":[["A","紀之、どうして僕の提案に賛成してくれなかったの？","Noriyuki, dō shite boku no teian ni sansei shite kurenakatta no?","紀之，你為什麼不贊成我的提議？","<b>〜てくれなかったの？</b>：「〜てくれる」的否定過去，帶有埋怨對方沒為自己做的語氣。"],["B","お金がかかりすぎると思うから。","Okane ga kakari sugiru to omou kara.","我認為那太花錢了。","<b>〜すぎる</b>表過度。<b>〜と思うから</b>：と引用想法，から說明理由（句子在此結束是口語用法）。"]]},{"name":"詢問遲到","lines":[["A","遅れるとわかった時、どうして電話してくれなかったのよ？","Okureru to wakatta toki, dō shite denwa shite kurenakatta no yo?","你知道你會遲到時為什麼不打個電話給我？","<b>〜とわかった時</b>：と引用內容＋時。<b>のよ</b>：女性用的責問語氣。"],["B","ごめん。公衆電話が見つからなかったんだ。","Gomen. Kōshū denwa ga mitsukaranakatta n da.","抱歉，我找不到公共電話。","<b>ごめん</b>：「ごめんなさい」的常體。<b>見つからなかった</b>：自動詞「見つかる」，強調「（怎麼找都）沒找到」。"]]},{"name":"詢問未穿西裝","lines":[["A","ダークブルーのスーツを着てほしかったのに。","Dāku burū no sūtsu wo kite hoshikatta no ni.","我希望你穿那件深藍色的西裝。","<b>〜てほしかったのに</b>：てほしい（希望對方做）的過去式＋のに，表事與願違的埋怨。"],["B","持ってないんだよ。","Motte nai n da yo.","我沒有啊。","<b>持ってない</b>：「持っていない」的縮約，表不擁有的狀態。"],["A","どうして？","Dō shite?","為什麼？","<b>どうして？</b>：最簡短的追問。"],["B","まだクリーニング屋さんにあるのさ。","Mada kurīningu-ya-san ni aru no sa.","還在送洗。","<b>まだ〜にある</b>：まだ表狀態持續。句尾<b>さ</b>為男性的隨性語氣。"]]},{"name":"詢問遲到（藉口）","lines":[["A","健一郎、どうして授業に遅刻したのですか？","Kenichirō, dō shite jugyō ni chikoku shita no desu ka?","健一郎，為什麼上課遲到？","<b>どうして〜たのですか</b>：詢問過去行為的理由，のです讓語氣較不咄咄逼人。"],["B","中村先生、うちのネコを動物病院に連れて行かなくてはならなかったのです。","Nakamura sensei, uchi no neko wo dōbutsu byōin ni tsurete ikanakute wa naranakatta no desu.","中村老師，因為我得帶我家的貓去獸醫院。","<b>連れて行く</b>：帶（人或動物）去。<b>〜なくてはならなかった</b>：義務的過去式。"],["A","ばかな！あなたの家にネコがいないってこと、私たちは知っているじゃない。本当の理由は何ですか？","Baka na! Anata no ie ni neko ga inai tte koto, watashitachi wa shitte iru ja nai. Hontō no riyū wa nan desu ka?","胡說，大家都知道你家沒養貓。真正的理由是什麼？","<b>〜ってこと</b>：「〜ということ」的口語，把句子名詞化。<b>〜じゃない</b>：反問，表「不是嗎」。"],["B","うーん、ねぼうしました。","Ūn, nebō shimashita.","嗯…我睡過頭了。","<b>うーん</b>：語塞時的填補詞。<b>ねぼうする</b>＝睡過頭。"]]},{"name":"詢問主修","lines":[["A","広伸、経済学を専攻している目的は何？","Hironobu, keizaigaku wo senkō shite iru mokuteki wa nani?","廣伸，你為什麼想要主修經濟學？","<b>〜ている目的は何？</b>：詢問目的的直接問法。<b>専攻する</b>＝主修。"],["B","うん、有能なビジネスマンになりたいからさ。","Un, yūnō na bijinesuman ni naritai kara sa.","嗯，我想當一名成功的商人。","<b>〜たいからさ</b>：たい＋から（理由）＋さ（男性語氣），回答目的。"]]}]},"13":{"title":"表達意見或感想","jp_title":"意見や感想を述べる","theme":"表達想法、觀點和感受","scenes":[{"name":"意見（勸阻）","lines":[["A","じゃあ、このことをお父さんには言わないことにしよう。","Jā, kono koto wo otōsan ni wa iwanai koto ni shiyō.","那麼，這件事就別跟爸爸說吧。","<b>〜ないことにしよう</b>：「〜ことにする」表自己做的決定，否定形＋よう提議「就決定不〜吧」。"],["B","お父さんに叱られると思うよ。","Otōsan ni shikarareru to omou yo.","我覺得會被爸爸罵。","<b>叱られる</b>：叱る的被動形。<b>〜と思う</b>：と引用自己的判斷。"]]},{"name":"意見（度假地）","lines":[["A","この連休に例の海辺へ行くのはどう？","Kono renkyū ni rei no umibe e iku no wa dō?","這次連續假期照慣例到海邊去，怎麼樣？","<b>行くのはどう？</b>：動詞＋の名詞化後用は提示，再以どう徵詢意見。<b>例の</b>＝慣例的那個。"],["B","いいと思うわ。でも私たちいつもあそこに行くわね。今年はほかの所に行きたいの。","Ii to omou wa. Demo watashitachi itsumo asoko ni iku wa ne. Kotoshi wa hoka no tokoro ni ikitai no.","好啊，可是我們一直都去那裡，今年我想去別的地方。","<b>いいと思うわ</b>：先肯定再用でも轉折，是委婉表達不同意見的常用結構。<b>わ・の</b>為女性語氣。"]]},{"name":"意見（提醒）","lines":[["A","では全て解決しました。","De wa subete kaiketsu shimashita.","那麼全部都解決了。","<b>全て</b>＝全部（書面語）。<b>解決しました</b>：漢語＋する的過去式。"],["B","ちょっと待ってください。あなたは一番大切なことを忘れているようですが。","Chotto matte kudasai. Anata wa ichiban taisetsu na koto wo wasurete iru yō desu ga.","請等一下，我想你好像忘了最重要的事。","<b>〜ようですが</b>：「よう」表委婉的推測，加が留白，避免直接指責對方。"]]},{"name":"意見（提出方案）","lines":[["A","僕の考えは、早めに、6時30分ごろに出発して、通勤時間をさけるといいと思う。","Boku no kangae wa, hayame ni, roku-ji sanjuppun goro ni shuppatsu shite, tsūkin jikan wo sakeru to ii to omou.","我的想法是早一點，在六點半左右出發，就可以避開通勤時間。","<b>〜といいと思う</b>：條件形と＋いい＋と思う，提出建議「這樣做應該不錯」。<b>さける</b>＝避開。"],["B","朝食はどうする。","Chōshoku wa dō suru.","那早餐怎麼辦？","<b>どうする</b>：常體，詢問對某事的處理方式。"],["A","町の外に出てから、どこかで食べましょう。","Machi no soto ni dete kara, doko ka de tabemashō.","等出了城，在找個地方吃吧！","<b>出てから</b>：て形＋から表先後。<b>どこかで</b>：不特定場所＋で（動作場所）。"]]},{"name":"意見（安全考量）","lines":[["A","金曜日の夕方、仕事の後に出発しましょう。","Kin'yōbi no yūgata, shigoto no ato ni shuppatsu shimashō.","星期五晚上下班後就出發吧。","<b>〜の後に</b>：名詞＋後に。<b>出発しましょう</b>提議共同行動。"],["B","それはちょっと、疲れている時に運転することは危険じゃないですか。","Sore wa chotto, tsukarete iru toki ni unten suru koto wa kiken ja nai desu ka.","不太好吧！在累的時候開車不是很危險嗎？","<b>それはちょっと</b>：說一半即表示不贊成，日語典型的婉拒。<b>〜じゃないですか</b>：反問以提醒對方。"],["A","そうですね、オーケー、土曜日の朝に出発しましょう。","Sō desu ne, ōkē, doyōbi no asa ni shuppatsu shimashō.","也是。那就，星期六早上出發吧！","<b>そうですね</b>：接受對方指正的緩衝語，再提出修正方案。"]]},{"name":"意見（結合方案）","lines":[["A","あなたの計画は、不可能ということはないでしょう。でも、私の計画の方が実際的だと思います。","Anata no keikaku wa, fukanō to iu koto wa nai deshō. Demo, watashi no keikaku no hō ga jissaiteki da to omoimasu.","你的計劃並不是不可行，不過我覺得我的計劃比較實際。","<b>〜ということはないでしょう</b>：雙重否定的委婉肯定。<b>〜の方が</b>：兩者比較時的偏好表現。"],["B","じゃあ、我々の計画を結びつけたらどうですか？","Jā, wareware no keikaku wo musubitsuketara dō desu ka?","那如果把我們的計畫結合呢？","<b>〜たらどうですか</b>：條件形＋どうですか，提出建議的常用句型。"],["A","ご意見をお聞かせていただきます？","Goiken wo okikasete itadakimasu?","我洗耳恭聽。","<b>お聞かせ〜いただく</b>：使役形＋いただく，「請讓我聽」的最高謙讓表現。"]]},{"name":"意見（音樂劇）","lines":[["A","先週の金曜日にミュージカルの「ミスサイゴン」を見ました。","Senshū no kin'yōbi ni myūjikaru no 'Misu Saigon' wo mimashita.","上星期五，我看了「西貢小姐」的音樂劇。","<b>先週の金曜日に</b>：具體時間點用に。<b>を見ました</b>：對象用を。"],["B","それはすごい！どう思いました？","Sore wa sugoi! Dō omoimashita?","哇，真是太棒了，你覺得怎麼樣？","<b>どう思いました？</b>：詢問感想的標準句型（用「どう」而非「何」）。"],["A","とてもいいミュージカルだと思いました。非常に感動しました。","Totemo ii myūjikaru da to omoimashita. Hijō ni kandō shimashita.","我覺得是很精采的音樂劇，讓人非常感動。","<b>〜と思いました</b>：と引用感想。<b>非常に</b>：程度副詞，比「とても」更書面。"]]}]},"14":{"title":"再次確認／確定","jp_title":"改めて確認する・確定する","theme":"深層確認和反覆確認","scenes":[{"name":"確認出身","lines":[["A","あなたは台湾出身でしょう？","Anata wa Taiwan shusshin deshō?","你是臺灣出生的吧！","<b>〜でしょう？</b>：升調時向對方確認自己的推測，相當於中文的「〜吧？」"],["B","はい、そうです。","Hai, sō desu.","是的。","<b>そうです</b>：肯定對方所說內容的固定回應。"]]},{"name":"確認身份","lines":[["A","あなたは本当にスカイダイバーですか？","Anata wa hontō ni sukai daibā desu ka?","你真的是跳傘員嗎？","<b>本当に〜ですか</b>：加上「本当に」加強確認的語氣。"],["B","はい、本当です。習いたいですか？","Hai, hontō desu. Naraitai desu ka?","是的，是真的。想學嗎？","<b>習いたいですか</b>：たい形的疑問句，直接問對方意願（對長輩宜改用「〜ませんか」）。"]]},{"name":"確認出身（京都）","lines":[["A","紀之の話だと、あなたは京都出身だそうですね。","Noriyuki no hanashi da to, anata wa Kyōto shusshin da sō desu ne.","紀之告訴我，你是京都出生的。","<b>〜の話だと</b>：<b>と</b>表條件、根據「根據〜的說法」。<b>〜だそうです</b>：傳聞助動詞，接名詞時用「だそうだ」。"],["B","そうです。行ったことはありますか？","Sō desu. Itta koto wa arimasu ka?","是的。你去過嗎？","<b>〜たことがありますか</b>：た形＋ことがある，詢問經驗的句型。"]]},{"name":"確認技能","lines":[["A","あなたは模型飛行機を作れそうですね。","Anata wa mokei hikōki wo tsukuresō desu ne.","聽說你會做模型飛機。","<b>作れそうですね</b>：可能形「作れる」＋そう（樣態推測）。"],["B","もちろんです。子供の時からやっています。","Mochiron desu. Kodomo no toki kara yatte imasu.","當然，小時候就開始做了。","<b>〜の時から</b>：時間起點用から。<b>やっています</b>：ている表從過去持續到現在。"]]},{"name":"確認想法","lines":[["A","この投資はいい考えだと思いますか？","Kono tōshi wa ii kangae da to omoimasu ka?","你覺得這個投資是很好的想法嗎？","<b>〜だと思いますか</b>：詢問對方的判斷，名詞後要加<b>だ</b>再接と思う。"],["B","ええ、そう思ってます。","Ē, sō omottemasu.","是的，我是這樣想的。","<b>そう思ってます</b>：「思っています」的口語縮約（い脫落）。"]]},{"name":"確認考試","lines":[["A","試験はパスできると思いますか。","Shiken wa pasu dekiru to omoimasu ka.","你覺得你能通過考試嗎？","<b>パスできる</b>：外來語＋できる，表可能。<b>〜と思いますか</b>詢問對方的預測。"],["B","はい、もちろんです。","Hai, mochiron desu.","是的，當然。","<b>もちろんです</b>：充滿自信的肯定。"]]},{"name":"確認地點（圖書館）","lines":[["A","すみませんが、図書館へ行く道を教えてください。","Sumimasen ga, toshokan e iku michi wo oshiete kudasai.","對不起，請告訴我怎麼去圖書館。","<b>〜へ行く道</b>：動詞普通形直接修飾名詞（連體修飾），不需加の。"],["B","図書館の本館ですか？","Toshokan no honkan desu ka?","是圖書館的本館嗎？","<b>〜ですか</b>：反問以確認對方所指的具體對象。"],["A","はい、そうです。","Hai, sō desu.","是的。","<b>はい、そうです</b>：確認無誤的標準回應。"]]},{"name":"否定（國籍）","lines":[["A","あなたはカナダ人ではありませんか。","Anata wa Kanada-jin de wa arimasen ka.","你不是加拿大人嗎？","<b>〜ではありませんか</b>：否定疑問，表「難道不是〜嗎」的確認。"],["B","ええ。カナダに住んでいますが、アメリカ人です。","Ē. Kanada ni sunde imasu ga, Amerika-jin desu.","是的，我住在加拿大，但我是美國人。","日語的<b>ええ</b>是針對「對方的話正確與否」而非事實本身，與中文的「是／不是」思路不同。<b>が</b>表逆接。"]]},{"name":"否定（游泳）","lines":[["A","あなたのお兄さんは水泳のチャンピョンでしょう。","Anata no oniisan wa suiei no chanpion deshō.","你哥哥是游泳冠軍嘛！","<b>〜でしょう</b>：降調時表推測「應該是〜吧」，向對方求證。"],["B","違います。弟です。","Chigaimasu. Otōto desu.","不是，是我弟弟。","<b>違います</b>：糾正對方認知時的固定說法，比「いいえ」更明確指出「事實不是這樣」。"]]},{"name":"否定（學校）","lines":[["A","あなたは東京大学の学生さんですね？","Anata wa Tōkyō daigaku no gakusei-san desu ne?","你是東京大學的學生嗎？","<b>〜ですね？</b>：<b>ね</b>用於確認自己的認知，升調發問。<b>学生さん</b>加さん表客氣。"],["B","いいえ。早稲田の学生です。","Iie. Waseda no gakusei desu.","不是，我是早稻田的學生。","<b>いいえ</b>否定後直接說出正確資訊，是清楚的糾正方式。"]]},{"name":"否定（父母）","lines":[["A","あなたのご両親は日本でお生まれになったのでしょう？","Anata no goryōshin wa Nihon de oumare ni natta no deshō?","你的父母是在日本出生的吧？","<b>お生まれになった</b>：お＋ます形＋になる的尊敬語過去式。<b>ご両親</b>：談對方的家人要加「ご」。"],["B","いいえ、でも祖父母はそうです。","Iie, demo sofubo wa sō desu.","不是，不過祖父母是在日本生的。","<b>でも〜はそうです</b>：<b>は</b>表對比，用「そうです」代替重複的內容。"]]},{"name":"否定（票券）","lines":[["A","本当に「キャッツ」の券が手に入るの？","Hontō ni 'Kyattsu' no ken ga te ni hairu no?","真的能拿到「Cats」的票嗎？","<b>手に入る</b>：慣用語「弄到手」（自動詞）。<b>〜の？</b>常體的確認語氣。"],["B","確実ではないけど、手に入られると思うよ。","Kakujitsu de wa nai kedo, te ni irareru to omou yo.","不是很確定，不過應該可以。","<b>〜ではないけど</b>：先保留再表達判斷。<b>〜と思うよ</b>：と引用推測，よ表告知。"]]},{"name":"否定（報告）","lines":[["A","この報告書はきょうの午後までに完成できるとおしゃっているのですか？","Kono hōkokusho wa kyō no gogo made ni kansei dekiru to osshatte iru no desu ka?","你是說這個報告今天下午可以完成嗎？","<b>〜とおっしゃっているのですか</b>：「言う」的尊敬語，用來覆述並確認對方的話。"],["B","いいや。あしたまで待ってください。","Iiya. Ashita made matte kudasai.","不是的，明天才會完成。","<b>まで</b>：表持續到某時點（相對地「までに」表期限前完成）。"]]}]},"15":{"title":"同意或反對對方的意見","jp_title":"相手の意見に同意する・反対する","theme":"表示同意、反對和意見異同","scenes":[{"name":"同意（1）","lines":[["A","彼女はいい人だけど、少し恥ずかしがり屋だね。","Kanojo wa ii hito dakedo, sukoshi hazukashigari-ya da ne.","她人不錯，只是有點害羞。","<b>〜けど</b>：逆接，先肯定再補充。<b>恥ずかしがり屋</b>：〜がり屋表「容易〜的人」。"],["B","うん、本当だね。","Un, hontō da ne.","嗯！對啊！","<b>本当だね</b>：附和對方的判斷，<b>ね</b>表共感。"]]},{"name":"同意（2）","lines":[["A","8時30分に集まって、早めに出よう。","Hachi-ji sanjuppun ni atsumatte, hayame ni deyō.","我們在8:30集合，早點出發吧！","<b>集まって</b>：て形連接兩個動作。<b>出よう</b>：意向形的提議。"],["B","そうだね。それではその時に。","Sō da ne. Sore de wa sono toki ni.","好主意！到時候見。","<b>そうだね</b>：表贊同。<b>それではその時に</b>：省略動詞的約定用語。"]]},{"name":"同意（3）","lines":[["A","夜運転すれば、道路もすいているでしょう。","Yoru unten sureba, dōro mo suite iru deshō.","假如我們晚上開車，車流量會比較少吧！","<b>〜すれば</b>：假定形表條件。<b>すいている</b>：「空く」的ている形，表空曠的狀態。"],["B","そうだね。","Sō da ne.","是啊！","<b>そうだね</b>：最常用的附和語。"]]},{"name":"同意（4）","lines":[["A","私たちは負けられません。あしたのストを貫徹しましょう。","Watashitachi wa makeraremasen. Ashita no suto wo kantetsu shimashō.","我們不能讓步。明天繼續罷工吧！","<b>負けられません</b>：可能形的否定，表「不能輸／不能讓步」。<b>貫徹しましょう</b>號召共同行動。"],["B","そうだ！","Sō da!","好！","<b>そうだ！</b>：強烈的贊同，語氣比「そうだね」更激昂。"]]},{"name":"同意（5）","lines":[["A","なんてつまらない話なんだろう。ぼくは行くよ。","Nante tsumaranai hanashi nan darō. Boku wa iku yo.","多無聊的座談！我要走了。","<b>なんて〜なんだろう</b>：感嘆句型「多麼〜啊」。<b>よ</b>表告知自己的決定。"],["B","僕も。さあ、行こう。","Boku mo. Sā, ikō.","我也是，我們走吧！","<b>僕も</b>：省略述語。<b>さあ</b>：催促行動的感嘆詞，<b>行こう</b>為意向形。"]]},{"name":"同意（6）","lines":[["A","あんな映画は最低だ。","Anna eiga wa saitei da.","那是我看過最爛的電影了。","<b>あんな＋名詞</b>：指離雙方都遠、或彼此都知道的事物。<b>最低</b>＝糟透了。"],["B","同感！","Dōkan!","我也有同感。","<b>同感！</b>：名詞單獨使用，表強烈贊同。"]]},{"name":"反對（1）","lines":[["A","紀之に賛成だな。君はどう？","Noriyuki ni sansei da na. Kimi wa dō?","我贊成紀之。你覺得呢？","<b>〜に賛成だ</b>：贊成的對象用<b>に</b>。<b>君はどう？</b>把話題丟給對方。"],["B","いや、僕は違うよ。陽子の意見の方が良いと思う。","Iya, boku wa chigau yo. Yōko no iken no hō ga yoi to omou.","嗯，我持不同的意見。我覺得陽子的意見比較好。","<b>いや</b>：常體的否定應答。<b>〜の方が良い</b>：比較後表明立場。"]]},{"name":"反對（2）","lines":[["A","このネクタイはそのグリーンのスーツに合いそうだね。","Kono nekutai wa sono gurīn no sūtsu ni aisō da ne.","我覺得這條領帶和那套綠色西裝很配。","<b>〜に合う</b>：相配的對象用<b>に</b>。<b>合いそう</b>：ます形＋そう表樣態推測。"],["B","合わないと思うわ。こちらの方がもっといいわよ。","Awanai to omou wa. Kochira no hō ga motto ii wa yo.","我覺得不配，這條比較適合。","<b>〜と思うわ</b>：用「と思う」緩和否定的語氣。<b>こちらの方が</b>提出替代方案。"]]},{"name":"反對（3）","lines":[["A","これは良い色だわ。そう思わない？","Kore wa yoi iro da wa. Sō omowanai?","這個顏色不錯，你覺得呢？","<b>〜だわ</b>：女性用的斷定語氣。<b>そう思わない？</b>：否定疑問，徵求同意。"],["B","うん、いいけど、君には合わないと思う。","Un, ii kedo, kimi ni wa awanai to omou.","是不錯，但我認為它不適合你。","<b>いいけど</b>：先局部同意再用けど轉折，是日語表達反對的典型節奏。"]]},{"name":"反對（4）","lines":[["A","僕のアイディアは良いでしょう？","Boku no aidia wa yoi deshō?","你覺得我的主意不錯吧？","<b>〜でしょう？</b>：徵求對方認同自己的看法。"],["B","悪くはないけど、健一郎の方が良さそうだな。","Waruku wa nai kedo, Kenichirō no hō ga yosasō da na.","是不錯，不過健一郎的似乎更好。","<b>悪くはない</b>：<b>は</b>加在否定中表保留的語氣。<b>良さそう</b>：いい的樣態形是「よさそう」（不規則）。"]]},{"name":"反對（5）","lines":[["A","彼の計画は最高だと思わない？","Kare no keikaku wa saikō da to omowanai?","你不覺得他的計劃很棒嗎？","<b>〜と思わない？</b>：否定疑問，強烈徵求同意。"],["B","別に。くわしく調べた方がいいよ。","Betsu ni. Kuwashiku shirabeta hō ga ii yo.","還不知道。我們最好還是仔細研究一下。","<b>別に</b>：單獨使用表「也還好、沒特別感覺」，委婉的不贊同。<b>〜た方がいい</b>提出建議。"]]}]},"16":{"title":"道歉","jp_title":"謝る","theme":"認錯、道歉和表示歉意","scenes":[{"name":"道歉（1）","lines":[["A","あっ、すみません。","A', sumimasen.","啊！對不起。","<b>あっ</b>：突發狀況的驚呼。<b>すみません</b>：日常道歉最常用的說法。"],["B","だいじょうぶです。","Daijōbu desu.","沒關係。","<b>だいじょうぶです</b>：接受道歉的固定回應。"]]},{"name":"道歉（2）","lines":[["A","すみません。痛かったですか？","Sumimasen. Itakatta desu ka?","對不起，痛嗎？","<b>痛かったですか</b>：い形容詞過去式＋ですか，關心對方是否受傷。"],["B","だいじょうぶです。","Daijōbu desu.","沒關係。","<b>だいじょうぶです</b>：表示自己沒事，用來免除對方的歉疚。"]]},{"name":"道歉（3）","lines":[["A","ああ、すみません。へまをしてしまって。","Ā, sumimasen. Hema wo shite shimatte.","對不起，不小心出了錯。","<b>〜てしまって</b>：てしまう表懊悔、無法挽回，這裡用て形留白，語氣更歉疚。"],["B","ご心配なく。だいじょうぶです。","Goshinpai naku. Daijōbu desu.","不要介意，沒事的。","<b>ご心配なく</b>：ご＋漢語名詞＋なく，「請別擔心」的簡潔敬語。"]]},{"name":"道歉（4）","lines":[["A","遅れてすみません。道路が渋滞していて。","Okurete sumimasen. Dōro ga jūtai shite ite.","抱歉，遲到了，因為道路擁擠。","<b>遅れてすみません</b>：て形說明道歉的原因。<b>〜ていて</b>：ている的て形，補述理由。"],["B","大丈夫です。私も着いたばかりです。","Daijōbu desu. Watashi mo tsuita bakari desu.","沒關係的，我也才剛到。","<b>〜たばかりです</b>：た形＋ばかり，表「才剛〜」，用來化解對方的歉意。"]]},{"name":"道歉（5）","lines":[["A","先生、すいません。昨日は授業に出られませんでした。風邪がひどくて、ずっと寝ていました。","Sensei, suimasen. Kinō wa jugyō ni deraremasen deshita. Kaze ga hidokute, zutto nete imashita.","老師，不好意思，昨天沒辦法來上課，感冒很嚴重，一直在休息。","<b>出られませんでした</b>：可能形的過去否定。<b>ひどくて</b>：い形容詞的て形表原因。"],["B","だいじょうぶ。今、体の調子はどう。","Daijōbu. Ima, karada no chōshi wa dō.","沒關係的。那你現在身體狀況如何？","<b>体の調子はどう</b>：關心對方身體狀況的固定問法。"]]},{"name":"道歉（6）","lines":[["A","由貴、本当に申し訳ないけど、あなたのパーティに出られないんだ。週末に出かけるんだよ。","Yuki, hontō ni mōshiwake nai kedo, anata no pātī ni derarenai n da. Shūmatsu ni dekakeru n da yo.","由貴，真的很抱歉，沒辦法去參加你的舞會。我這個週末要出去。","<b>申し訳ない</b>：比「すみません」更鄭重的道歉。<b>〜んだ</b>：說明自己的狀況。"],["B","それは本当に残念ね。あなたが来るのを楽しみにしていたのだけど。","Sore wa hontō ni zannen ne. Anata ga kuru no wo tanoshimi ni shite ita no dakedo.","那真是太可惜了！我一直很期望你能來。","<b>〜のを楽しみにしていた</b>：の名詞化＋を楽しみにする（期待），過去進行表一直期待著。"]]}]},"17":{"title":"各種情感的表現","jp_title":"さまざまな感情を表す","theme":"喜怒哀樂和情感表達","scenes":[{"name":"喜悅（考試）","lines":[["A","おかあさん、やったよ！試験に合格したよ。","Okāsan, yatta yo! Shiken ni gōkaku shita yo.","媽媽，我做到了！我通過考試了！","<b>やった</b>：「やる」的過去式，成功時的歡呼。<b>〜に合格する</b>：合格的對象用<b>に</b>。"],["B","すばらしいわ、紀之。とても嬉しいわ。","Subarashii wa, Noriyuki. Totemo ureshii wa.","太好了！紀之，我好高興。","<b>すばらしいわ</b>：い形容詞＋女性終助詞わ。<b>嬉しい</b>是形容自己情緒的形容詞，不可直接用於他人。"]]},{"name":"喜悅（工作）","lines":[["A","新しい仕事を見つけたんだって？","Atarashii shigoto wo mitsuketa n datte?","聽說你找到新工作？","<b>〜んだって？</b>：「〜のだそうだ」的口語，表「聽說〜是嗎」，升調確認傳聞。"],["B","そうだよ。見つけたよ。","Sō da yo. Mitsuketa yo.","對，找到了。","<b>そうだよ</b>：肯定對方的傳聞，再重複動詞加以確認。"],["A","それはすばらしい。おめでとう！","Sore wa subarashii. Omedetō!","那真是太好了。恭喜你！","<b>おめでとう</b>：「おめでとうございます」的常體，向對方道賀。"]]},{"name":"驚訝（得獎）","lines":[["A","クイズ番組で一等賞を取ったよ！","Kuizu bangumi de ittōshō wo totta yo!","我得到猜謎節目的頭獎耶！","<b>〜で</b>表場所、範圍。<b>一等賞を取る</b>＝拿到頭獎，句尾よ告知新消息。"],["B","驚きだ！うちでは今まで誰も賞なんて取ったことがないよ。","Odoroki da! Uchi de wa ima made dare mo shō nante totta koto ga nai yo.","真的嗎？家裡到現在還沒有人拿過什麼獎之類的。","<b>〜なんて</b>：舉例並帶輕視或意外的語氣。<b>〜たことがない</b>：表從未有過的經驗。"],["A","必ず「最初」というものがあるさ。","Kanarazu 'saisho' to iu mono ga aru sa.","凡事總有第一次嘛！","<b>〜というもの</b>：把詞語當概念提出。句尾<b>さ</b>為男性隨性的斷定。"]]},{"name":"驚訝（機票）","lines":[["A","あのね。ハワイへのチケットが2枚あたったよ。","Ano ne. Hawai e no chiketto ga ni-mai atatta yo.","喂！我贏得二張到夏威夷的機票。","<b>あのね</b>：要說事情前的呼喚。<b>2枚</b>：票券的量詞用「枚」。<b>あたる</b>＝中獎。"],["B","信じられないわ？うそでしょう。","Shinjirarenai wa? Uso deshō.","我不信！你在開玩笑吧！","<b>信じられない</b>：可能形的否定，「無法相信」。<b>うそでしょう</b>：半開玩笑的質疑。"],["A","ほんとうさ。ここにあるよ。ほら。","Hontō sa. Koko ni aru yo. Hora.","真的，你看在這裡。","<b>ほんとうさ</b>：男性語氣的強調。<b>ほら</b>：要對方看過來的感嘆詞。"],["B","わあーい。いつ発つの？","Wā-i. Itsu tatsu no?","哇…！何時出發？","<b>発つ</b>＝出發（比「出る」正式）。<b>〜の？</b>常體疑問。"]]},{"name":"同情（受傷）","lines":[["A","健一郎は行けないと思うよ。きのう足を折ったんだ。","Kenichirō wa ikenai to omou yo. Kinō ashi wo otta n da.","我想健一郎不能去了，昨天他腿骨折了。","<b>行けない</b>：可能形否定。<b>足を折った</b>：他動詞「折る」表自己弄斷，慣用於骨折。"],["B","それは大変だ。気の毒だね。","Sore wa taihen da. Kinodoku da ne.","真糟糕。真可憐喲！","<b>それは大変だ</b>：對壞消息的即時反應。<b>気の毒</b>：對他人不幸的同情（不用於自己）。"],["A","そうだね。","Sō da ne.","是啊！","<b>そうだね</b>：附和對方的感慨。"]]},{"name":"同情（心情低落）","lines":[["A","陽子、きょうは調子がよくなさそうだね。だいじょうぶ？","Yōko, kyō wa chōshi ga yokunasasō da ne. Daijōbu?","陽子，你今天身體好像不太舒服，還好嗎？","<b>よくなさそう</b>：いい的否定「よくない」＋そう，樣態推測的變化較不規則。"],["B","だいじょうぶよ。ちょっと気分がふさいでいるの。","Daijōbu yo. Chotto kibun ga fusaide iru no.","沒關係啦！只是心情有點鬱悶。","<b>気分がふさぐ</b>＝心情鬱悶。<b>の</b>為女性用的說明語氣。"],["A","それはかわいそうに。何か僕にできるかい？","Sore wa kawaisō ni. Nani ka boku ni dekiru kai?","那太可憐了，有沒有什麼我可以幫忙的？","<b>かわいそうに</b>：形容動詞的副詞形，單獨使用表同情。<b>〜かい？</b>男性用的常體疑問。"]]},{"name":"同情（吵架）","lines":[["A","今気分はどうですか。","Ima kibun wa dō desu ka.","現在心情還好吧？","<b>気分はどうですか</b>：關心對方情緒或身體狀況的固定問法。"],["B","うん。きょうはちょっと落ち込んでるんだ。家族と喧嘩しちゃって。","Un. Kyō wa chotto ochikonderu n da. Kazoku to kenka shichatte.","嗯。今天心情有點差，跟家裡的人吵了一架。","<b>落ち込んでる</b>：「落ち込んでいる」的縮約。<b>しちゃって</b>：「してしまって」的口語，表懊惱。"],["A","なるほどね。","Naruhodo ne.","原來如此。","<b>なるほど</b>：表理解對方說明後的認同。"]]},{"name":"同情（無法同行）","lines":[["A","圭子はおかあさんが病気になったから一緒に行けないよ。","Keiko wa okāsan ga byōki ni natta kara issho ni ikenai yo.","圭子因為母親生病不能一起去了。","<b>〜になったから</b>：<b>から</b>表原因。<b>病気になる</b>：狀態變化用「〜になる」。"],["B","ああ、それは気の毒ですね。","Ā, sore wa kinodoku desu ne.","唉！那好可惜哦！","<b>気の毒ですね</b>：對第三者的不幸表示同情的固定說法。"],["A","うん。圭子は旅行をとても楽しみにしていたからね。","Un. Keiko wa ryokō wo totemo tanoshimi ni shite ita kara ne.","嗯！圭子非常期待這次的旅行。","<b>楽しみにしていた</b>：期待的過去進行式，強調一直期待著。<b>からね</b>補充理由。"],["B","じゃあ、今回またチャンスがあったら、もう一度誘いましょう。","Jā, konkai mata chansu ga attara, mō ichido sasoimashō.","那下次如果有機會，再邀她一起去吧！","<b>〜たら</b>：假設條件。<b>誘いましょう</b>：ましょう提議共同行動。"]]},{"name":"哀悼","lines":[["A","お母さんがお亡くなりになったそうで、お気の毒に思います。つらいことでしょう。","Okāsan ga onakunari ni natta sō de, okinodoku ni omoimasu. Tsurai koto deshō.","聽說令堂過世了，我很難過。一定很難受吧。","<b>お亡くなりになった</b>：「死ぬ」的最高敬語。<b>〜そうで</b>：傳聞＋で表原因。<b>でしょう</b>推測對方的心情。"],["B","ええ。とても急だったものですから。","Ē. Totemo kyū datta mono desu kara.","是的。事情很突然。","<b>〜ものですから</b>：說明理由的鄭重表現，帶有辯解、體諒的語氣。"]]},{"name":"安慰（手術）","lines":[["A","手術は成功だったわ。母はきっと元気になるわ。","Shujutsu wa seikō datta wa. Haha wa kitto genki ni naru wa.","手術成功了。母親一定會康復的。","<b>きっと</b>：與推測表現呼應，表強烈的把握。<b>元気になる</b>：狀態變化。"],["B","ほっとしたよ。とても心配してたんだ。","Hotto shita yo. Totemo shinpai shiteta n da.","放心了。我很擔心。","<b>ほっとした</b>：擬態語＋する，表鬆一口氣。<b>心配してた</b>為「していた」的縮約。"]]},{"name":"安慰（自責）","lines":[["A","ねえ、君はよく頑張りました。今はお医者さんにまかせるんだ。","Nē, kimi wa yoku ganbarimashita. Ima wa oisha-san ni makaseru n da.","嘿，你已經很努力了。現在就交給醫生吧。","<b>ねえ</b>：親暱的呼喚。<b>〜にまかせる</b>：委託的對象用<b>に</b>。<b>んだ</b>表叮嚀的語氣。"],["B","わかってるわ。でも、何もできなくてとてもはがゆいのよ。","Wakatteru wa. Demo, nani mo dekinakute totemo hagayui no yo.","我知道。可是什麼都做不了，好著急啊。","<b>わかってる</b>：「わかっている」的縮約。<b>〜なくて</b>：否定的て形表原因。<b>はがゆい</b>＝焦急難耐。"],["A","君の気持ちはよくわかるよ。","Kimi no kimochi wa yoku wakaru yo.","我很明白你的心情。","<b>気持ちはよくわかる</b>：<b>は</b>提示主題，安慰他人的固定說法。"]]},{"name":"安慰（不是你的錯）","lines":[["A","ああ、泥棒が入ったのは僕のせいだ。窓を調べるべきだった。","Ā, dorobō ga haitta no wa boku no sei da. Mado wo shiraberu beki datta.","唉，遭小偷是我的錯。我應該檢查窗戶的。","<b>〜のは僕のせいだ</b>：の名詞化＋は，「〜是我的錯」。<b>〜べきだった</b>：表對過去的後悔「本該〜」。"],["B","ねえ、君自身を責める必要はないよ。君のせいではないよ。","Nē, kimi jishin wo semeru hitsuyō wa nai yo. Kimi no sei de wa nai yo.","嘿，你不必自責。這不是你的錯。","<b>〜必要はない</b>：辭書形＋必要はない，表「沒必要〜」。"],["A","いや、そうだよ。僕のせいさ。","Iya, sō da yo. Boku no sei sa.","不，就是。是我的錯。","<b>いや、そうだよ</b>：否定對方的安慰、堅持己見。<b>さ</b>為男性語氣。"]]}]},"18":{"title":"聊天（天氣）","jp_title":"天気について話す","theme":"閒聊、閒談、天氣話題","scenes":[{"name":"變冷","lines":[["A","きょうは冷えてきたね。","Kyō wa hiete kita ne.","今天變得好冷喔。","<b>冷えてきた</b>：て形＋くる，表變化朝現在持續發生「越來越〜」。"],["B","うん。午後は雨かもしれないね。","Un. Gogo wa ame kamoshirenai ne.","嗯，下午可能會下雨。","<b>かもしれない</b>：表可能性較低的推測。"],["A","そうでないといいだけど。","Sō de nai to ii dakedo.","希望不要。","<b>そうでないといい</b>：<b>と</b>條件＋いい，表期望「不要那樣才好」。"]]},{"name":"很冷","lines":[["A","いやー、きょうは寒いね。","Iyā, kyō wa samui ne.","真討厭，今天好冷。","<b>いやー</b>：表厭煩或感慨的感嘆詞。<b>寒いね</b>：向對方求取共感。"],["B","うん、それに風も強いよ。","Un, sore ni kaze mo tsuyoi yo.","是啊，而且風好大。","<b>それに</b>：追加同方向的資訊。<b>も</b>表「也」。"],["A","今晩は雪かもしれない。","Konban wa yuki kamoshirenai.","今天晚上可能會下雪。","<b>雪かもしれない</b>：名詞直接接「かもしれない」，不需加だ。"]]},{"name":"變暖","lines":[["A","やあ。きょうは暖かいね。","Yaa. Kyō wa atatakai ne.","嗨，今天還蠻暖和的嘛！","<b>暖かいね</b>：談天氣是日語寒暄的核心，句尾ね不可少。"],["B","そうだね。冬が終わったみたいだ。","Sō da ne. Fuyu ga owatta mitai da.","是啊，看來冬天已經過去了。","<b>〜みたいだ</b>：口語的推測，根據眼前狀況判斷。"],["A","よかったね。","Yokatta ne.","太好了。","<b>よかったね</b>：いい的過去式，對好事表示欣慰。"]]},{"name":"天氣預報","lines":[["A","このすばらしい天気を見て！テレビでは雨が降るって言ってたのに。","Kono subarashii tenki wo mite! Terebi de wa ame ga furu tte itteta no ni.","你看，今天天氣真好！電視卻說會下雨。","<b>〜って言ってた</b>：<b>って</b>是「と」的口語引用。<b>のに</b>表與預期相反的不滿。"],["B","天気予報が信じられないんでしょう？","Tenki yohō ga shinjirarenai n deshō?","氣象報導能相信嗎？","<b>信じられない</b>：可能形否定＋んでしょう，反問對方是否同意。"],["A","うん、よくはずれるんだ。","Un, yoku hazureru n da.","嗯，它們經常預測錯誤。","<b>はずれる</b>＝落空、預測錯誤（自動詞）。<b>んだ</b>補充說明。"]]},{"name":"好天氣","lines":[["A","すばらしい日だね。","Subarashii hi da ne.","今天天氣真不錯！","<b>すばらしい日だね</b>：形容詞修飾名詞＋だね，天氣寒暄的定型句。"],["B","うん、よく晴れてる。","Un, yoku hareteru.","嗯，天氣相當晴朗。","<b>晴れてる</b>：「晴れている」的縮約，ている表現在的狀態。"],["A","こんないい日がしばらく続いてほしいな。","Konna ii hi ga shibaraku tsuzuite hoshii na.","真希望這種好天氣能持續久一點。","<b>〜てほしい</b>：希望（非人為的）事態持續。<b>な</b>為自言自語的感嘆。"]]},{"name":"炎熱","lines":[["A","やあ、なんて暑い日なんだろう。","Yaa, nante atsui hi nan darō.","哇！熱死了！","<b>なんて〜なんだろう</b>：感嘆句型，中間放形容詞＋名詞。"],["B","うん、たえられないよ。","Un, taerarenai yo.","是啊，真受不了。","<b>たえられない</b>：可能形的否定，「受不了」。"],["A","異常だね。","Ijō da ne.","好奇怪啊！","<b>異常だね</b>：形容動詞＋だね，簡短的評論。"]]},{"name":"梅雨","lines":[["A","なんて長い梅雨なんだろう。","Nante nagai tsuyu nan darō.","好長的梅雨季啊！","<b>なんて長い〜なんだろう</b>：感嘆型的抱怨。"],["B","まったくだね。新記録にちがいないよ。","Mattaku da ne. Shinkiroku ni chigainai yo.","不是嗎？一定會創下新記錄。","<b>まったくだ</b>：強烈的同意。<b>〜にちがいない</b>：表幾乎確定的推測，比「かもしれない」肯定得多。"],["A","うん、天気予報によると20年ぶりだって。","Un, tenki yohō ni yoru to nijū-nen buri datte.","是啊！氣象預報說，這是二十年來最長的一次。","<b>〜によると</b>：表資訊來源，常與傳聞的「〜だって・そうだ」呼應。<b>〜ぶり</b>＝相隔〜之久。"]]},{"name":"帶傘","lines":[["A","きょう雨が降るってテレビで聞いたよ。","Kyō ame ga furu tte terebi de kiita yo.","電視上說今天可能會下雨。","<b>〜って</b>：口語的引用助詞（＝と）。<b>で</b>表資訊來源的媒介。"],["B","ほんとう？雨が降るようにまったく思えないね。","Hontō? Ame ga furu yō ni mattaku omoenai ne.","真的？看起來不像會下雨啊。","<b>〜ように思えない</b>：「〜ように思える」的否定，表「看起來不像會〜」。"],["A","でも、カサを持って行きなさい。転ばぬ先の杖だよ。","Demo, kasa wo motte ikinasai. Korobanu saki no tsue da yo.","不過，還是帶著雨傘吧！未雨綢繆。","<b>持って行きなさい</b>：て形＋行く（帶去）＋なさい（溫和命令）。<b>転ばぬ先の杖</b>為諺語「未雨綢繆」。"]]}]},"19":{"title":"關於時間及日期的談話","jp_title":"時間や日時について話す","theme":"時間、日期、時刻相關對話","scenes":[{"name":"問時間（1）","lines":[["A","すみませんが。今何時でしょうか？","Sumimasen ga. Ima nanji deshō ka?","對不起，請問現在幾點？","<b>今何時でしょうか</b>：「ですか」→「でしょうか」，向陌生人問時間更禮貌。"],["B","2時30分です。","Ni-ji sanjuppun desu.","現在2點半。","<b>2時30分です</b>：時刻的讀法為「にじさんじゅっぷん」。"]]},{"name":"問時間（2）","lines":[["A","すみませんが、時間を教えていただけますでしょうか。","Sumimasen ga, jikan wo oshiete itadakemasu deshō ka.","對不起，可以告訴我時間嗎？","<b>〜ていただけますでしょうか</b>：可能形＋でしょうか，疊加的最高級客氣說法。"],["B","1時20分です。","Ichi-ji nijuppun desu.","1點20分。","<b>1時20分</b>：讀作「いちじにじゅっぷん」，分的讀音會依數字產生音變。"]]},{"name":"問時間（3）","lines":[["A","おじゃまして申しわけありませんが、何時だか教えていただきますか？","Ojama shite mōshiwake arimasen ga, nanji da ka oshiete itadakimasu ka?","抱歉打擾您一下，您能告訴我現在幾點嗎？","<b>おじゃまして申しわけありませんが</b>：打擾前的鄭重致歉。<b>何時だか</b>：疑問句嵌入成名詞子句。"],["B","いいですよ。11時50分です。","Ii desu yo. Jūichi-ji gojuppun desu.","沒問題，現在11點50分。","<b>いいですよ</b>：爽快答應後再提供資訊。"]]},{"name":"對錶（1）","lines":[["A","時計を合わせたいのですが。正確な時間は何時でしょうか？","Tokei wo awasetai no desu ga. Seikaku na jikan wa nanji deshō ka?","我想調整我的手錶，現在應該是幾點幾分？","<b>〜たいのですが</b>：說明自己的目的後留白，讓對方理解你的請求。"],["B","ちょうど4時25分です。","Chōdo yo-ji nijūgo-fun desu.","剛好4點25分。","<b>ちょうど</b>：副詞，表「剛好、正好」。"]]},{"name":"對錶（2）","lines":[["A","あなたの腕時計は2時30分ですか？","Anata no udedokei wa ni-ji sanjuppun desu ka?","你的手錶是2點30分嗎？","<b>〜は2時30分ですか</b>：以名詞句直接確認錶上的時間。"],["B","いいえ、2時27分です。","Iie, ni-ji nijūnana-fun desu.","不是，我的是2點27分。","<b>いいえ</b>否定後立刻提供正確資訊。"],["A","あの時計によると、あなたのは正しいですね。私のは進んでいるに違いありません。","Ano tokei ni yoru to, anata no wa tadashii desu ne. Watashi no wa susunde iru ni chigai arimasen.","根據那個時鐘的時間，你的錶才是對的，我的太快了。","<b>〜によると</b>表根據。<b>あなたの</b>：<b>の</b>代替已知名詞（＝你的錶）。<b>進んでいる</b>＝走得快。"]]},{"name":"手錶變慢","lines":[["A","この2、3日で私の腕時計は遅れています。","Kono ni-san-nichi de watashi no udedokei wa okurete imasu.","這2、3天我的手錶變慢了。","<b>この2、3日で</b>：<b>で</b>表期間範圍。<b>遅れています</b>：ている表持續的狀態。"],["B","たぶん電池を替えた方がいいでしょう。","Tabun denchi wo kaeta hō ga ii deshō.","也許該換電池了。","<b>〜た方がいい</b>：た形＋方がいい，提出建議。<b>たぶん〜でしょう</b>互相呼應。"],["A","そうですね。","Sō desu ne.","好主意。","<b>そうですね</b>：接受對方建議的回應。"]]},{"name":"約兜風","lines":[["A","日曜日にドライブに行かない？","Nichiyōbi ni doraibu ni ikanai?","禮拜天要不要去兜風？","<b>〜に行かない？</b>：否定疑問的邀約，比肯定形更不強迫。"],["B","それはいいね。何時に出ようか？","Sore wa ii ne. Nanji ni deyō ka?","好主意，什麼時候出發？","<b>出ようか？</b>：意向形＋か，與對方商量時間。"],["A","9時30分に行こう。","Ku-ji sanjuppun ni ikō.","那就約9點30分。","<b>行こう</b>：意向形，定下結論。"]]},{"name":"約載機場","lines":[["A","空港まで乗せて行ってもらえますか？","Kūkō made nosete itte moraemasu ka?","你能載我去機場嗎？","<b>乗せて行ってもらえますか</b>：「〜てもらう」的可能形，客氣地請求。"],["B","いいですよ。飛行機は何時に出ますか？","Ii desu yo. Hikōki wa nanji ni demasu ka?","可以啊，飛機什麼時候起飛？","<b>何時に出ますか</b>：時刻用<b>に</b>標示，「出る」用於交通工具的發車、起飛。"],["A","10時45分です。","Jū-ji yonjūgo-fun desu.","10點45分。","<b>10時45分</b>：讀作「じゅうじよんじゅうごふん」。"]]},{"name":"問出發日","lines":[["A","東京へはいつ発つの？","Tōkyō e wa itsu tatsu no?","你什麼時候去東京？","<b>東京へは</b>：へ＋は，強調對比。<b>いつ発つの？</b>常體疑問。"],["B","8月2日に発つ予定です。","Hachi-gatsu futsuka ni tatsu yotei desu.","我打算8月2日走。","<b>〜予定です</b>：辭書形＋予定，表已定的計畫。日期用<b>に</b>。"]]},{"name":"問生日","lines":[["A","春男、生年月日はいつなの？","Haruo, seinengappi wa itsu na no?","春男，你生日是什麼時候？","<b>いつなの？</b>：疑問詞＋な＋の，名詞句的常體疑問。"],["B","1965年2月10日だよ。","Sen-kyūhyaku-rokujūgo-nen ni-gatsu tōka da yo.","1965年2月10日。","<b>1965年2月10日</b>：年月日的順序與中文相同，年讀作「せんきゅうひゃくろくじゅうごねん」。"]]}]},"20":{"title":"問路","jp_title":"道をたずねる","theme":"詢問方向、路線、地點","scenes":[{"name":"問路（公園）","lines":[["A","すみません。上野公園への道を教えてくださいますか？","Sumimasen. Ueno kōen e no michi wo oshiete kudasaimasu ka?","對不起。能不能告訴我怎麼去上野公園？","<b>〜への道</b>：へ＋の，方向助詞可加の修飾名詞（が・を不行）。<b>〜てくださいますか</b>為敬語請求。"],["B","もちろんです。あと3ブロックまっすぐ行ってください。","Mochiron desu. Ato san-burokku massugu itte kudasai.","當然可以。再繼續一直走三條街就到了。","<b>あと3ブロック</b>：あと＋數量表「還剩〜」。<b>〜てください</b>指路的基本形。"]]},{"name":"問洗手間","lines":[["A","お手洗いはどちらか教えていただけますか？","Otearai wa dochira ka oshiete itadakemasu ka?","能不能告訴我洗手間在哪裡？","<b>お手洗い</b>：廁所的委婉說法。<b>どちら</b>為「どこ」的禮貌形。"],["B","はい。この廊下をまっすぐ行って。エスカレーターのすぐ手前の左手にあります。","Hai. Kono rōka wo massugu itte. Esukarētā no sugu temae no hidarite ni arimasu.","好。從這走廊直走，就在電扶梯前面的左邊。","<b>この廊下を</b>：<b>を</b>表通過的路徑（非受詞）。<b>手前</b>＝靠自己這一側，<b>左手</b>＝左邊。"]]},{"name":"問公車站","lines":[["A","バス停を探しているのですが。","Basu-tei wo sagashite iru no desu ga.","我在找公車站牌。","<b>探しているのですが</b>：ている＋のですが，說明狀況後留白，等對方主動幫忙。"],["B","ああ、それは簡単です。通りの向こう側です。西口から出なさい。あそこの出口です。","Ā, sore wa kantan desu. Tōri no mukōgawa desu. Nishiguchi kara denasai. Asoko no deguchi desu.","喔！那很簡單。就在街的對面。從西側出口出去吧！就在出口的地方。","<b>向こう側</b>＝對面。<b>出なさい</b>：なさい為溫和的命令，長輩對晚輩使用。"]]},{"name":"問計程車","lines":[["A","どこでタクシーに乗れるか知っていますか？","Doko de takushī ni noreru ka shitte imasu ka?","你知道在哪裡可以搭得到計程車嗎？","<b>どこで〜か知っていますか</b>：疑問句嵌入成名詞子句。動作場所用<b>で</b>，搭乘的對象用<b>に</b>。"],["B","ここを横切り、次の信号まで歩くんです。そこにタクシーの乗り場があります。","Koko wo yokogiri, tsugi no shingō made aruku n desu. Soko ni takushī no noriba ga arimasu.","從這裡穿過去，走到下一個紅綠燈。計程車站就在那裡。","<b>横切り</b>：ます形去ます的中止形，連接下一動作。<b>まで</b>表移動的終點。"],["A","地下鉄の入り口の近くですか？","Chikatetsu no iriguchi no chikaku desu ka?","在靠近地下鐵入口的附近嗎？","<b>〜の近くですか</b>：以名詞句確認位置關係。"],["B","そうです。そのすぐうしろです。","Sō desu. Sono sugu ushiro desu.","是的。就在那後面。","<b>そのすぐうしろ</b>：指示詞＋位置名詞，「就在那的正後方」。"]]},{"name":"問圖書館","lines":[["A","市立図書館への道を教えてもらえますか？","Shiritsu toshokan e no michi wo oshiete moraemasu ka?","能不能告訴我怎麼去市立圖書館？","<b>〜てもらえますか</b>：「〜てもらう」的可能形，客氣的請求。"],["B","ええ。ここからちょっと遠いですよ。10ブロックか12ブロックでしょう。","Ē. Koko kara chotto tōi desu yo. Ju-burokku ka jūni-burokku deshō.","喔！離這裡蠻遠的喲。大約隔10或12個街。","<b>ここから</b>：起點用から。<b>〜か〜でしょう</b>：<b>か</b>表數量的不確定。"],["A","どうしたらいいですか？","Dō shitara ii desu ka?","你有什麼建議嗎？","<b>どうしたらいいですか</b>：條件形＋いい，徵詢建議的萬用句型。"],["B","2番のバスに乗ってください。ちょうどここにバス停がありますから。そして3番目の停留所で降りると、図書館のすぐ前です。","Ni-ban no basu ni notte kudasai. Chōdo koko ni basu-tei ga arimasu kara. Soshite san-banme no teiryūjo de oriru to, toshokan no sugu mae desu.","坐2路公車。剛好在這裡有站牌。第三站下車就是圖書館前面了。","<b>〜から</b>表理由。<b>3番目</b>：數字＋番目表順序。<b>降りると</b>：と表必然的結果。"]]},{"name":"問電車","lines":[["A","四ツ谷行きの電車はどう乗るのですか？","Yotsuya-yuki no densha wa dō noru no desu ka?","要去四谷的電車怎麼坐？","<b>四ツ谷行き</b>：地名＋行き，表開往該地。<b>どう乗るのですか</b>詢問方法。"],["B","ここにはとまりません。この電車で次の駅まで行き、降りて、2番線の電車に乗ってください。","Koko ni wa tomarimasen. Kono densha de tsugi no eki made iki, orite, ni-bansen no densha ni notte kudasai.","這裡不會停。要坐這班電車到下一個車站下車，然後轉坐2號線的電車。","<b>行き</b>：中止形連接連續動作。<b>で</b>表交通工具，<b>2番線</b>指月台線號。"],["A","次の駅で乗りかえて、2番線の電車に乗りますね？","Tsugi no eki de norikaete, ni-bansen no densha ni norimasu ne?","在下一個車站坐2號線的電車，對不對？","<b>乗りかえて</b>＝轉乘。句尾<b>ね？</b>用來覆述並確認自己的理解。"],["B","そのとおりです。","Sono tōri desu.","沒錯。","<b>そのとおりです</b>：確認對方理解完全正確的固定說法。"]]},{"name":"問銀行","lines":[["A","国立銀行へどのように行くのか教えてくださいますか？","Kokuritsu ginkō e dono yō ni iku no ka oshiete kudasaimasu ka?","能不能告訴我到國立銀行怎麼去？","<b>どのように</b>：「どう」的鄭重形。<b>〜のか教えて〜</b>：嵌入疑問句時常加の。"],["B","はい。ここから3ブロック北です。左側のおおきなガラスの建物です。見失うことはありませんよ。","Hai. Koko kara san-burokku kita desu. Hidarigawa no ōki na garasu no tatemono desu. Miushinau koto wa arimasen yo.","好。從這裡向北走3條街。就在左邊的玻璃帷幕大樓裡，一定看得到。","<b>見失うことはありませんよ</b>：「〜ことはない」表「不會〜、不必〜」，這裡指絕不會看漏。"]]},{"name":"不知道（1）","lines":[["A","すみません、国立西洋美術館はどこか知っていますか？","Sumimasen, kokuritsu seiyō bijutsukan wa doko ka shitte imasu ka?","對不起，你知道國立西洋美術館在哪裡嗎？","<b>どこか知っていますか</b>：先問對方是否知道，比直接問路更客氣。"],["B","すみません。私もこの辺はわからないのです。誰か他の人に聞いたほうがいいですね。","Sumimasen. Watashi mo kono hen wa wakaranai no desu. Dare ka hoka no hito ni kiita hō ga ii desu ne.","對不起。我對這附近也不清楚。你問別人比較好。","<b>も</b>表「我也（跟你一樣）」。<b>〜たほうがいいですね</b>：提出建議。"],["A","はい、ありがとうございます。","Hai, arigatō gozaimasu.","好，謝謝你。","即使對方幫不上忙也要道謝，是日語會話的基本禮節。"]]},{"name":"不知道（2）","lines":[["A","失礼ですが。中正紀念堂へ行くバスはどれか教えてくださいますか？","Shitsurei desu ga. Chūsei kinendō e iku basu wa dore ka oshiete kudasaimasu ka?","對不起，能告訴我去中正紀念堂搭哪班公車嗎？","<b>失礼ですが</b>：向陌生人搭話的緩衝。<b>どれ</b>：三者以上中選一個。"],["B","すみません、ここに住んでいないのです。あそこの警官にたずねたらどうですか？","Sumimasen, koko ni sunde inai no desu. Asoko no keikan ni tazunetara dō desu ka?","對不起，我不住這裡。你問那邊的警察如何？","<b>〜たらどうですか</b>：條件形＋どうですか，委婉提出建議。"],["A","ありがとうございます。","Arigatō gozaimasu.","謝謝你。","<b>ありがとうございます</b>：現在式表對方的好意仍在持續（或剛完成）。"]]},{"name":"不知道（3）","lines":[["A","すみません、植物園はどこか知っていますか？","Sumimasen, shokubutsuen wa doko ka shitte imasu ka?","對不起，你知道植物園在哪裡嗎？","<b>どこか知っていますか</b>：問路時的標準開場。"],["B","すみません、全くわかりません。あそこのガソリンスタンドの店員に聞いてください。","Sumimasen, mattaku wakarimasen. Asoko no gasorin sutando no ten'in ni kiite kudasai.","對不起，我完全不知道。請問那邊加油站的店員。","<b>全く〜ません</b>：全く必與否定呼應，表完全否定。"],["A","ああ。分かりました。","Ā. Wakarimashita.","啊，我知道了。","<b>分かりました</b>：表理解、接受對方的指引。"]]}]},"21":{"title":"打電話","jp_title":"電話で話す","theme":"電話禮儀、通話用語","scenes":[{"name":"通話（1）","lines":[["A","もしもし、春子をお願いします。","Moshimoshi, Haruko wo onegai shimasu.","喂，請問春子在嗎？","<b>もしもし</b>：電話專用的招呼。<b>〜をお願いします</b>：要求找人講電話的固定說法。"],["B","私です。","Watashi desu.","我就是。","<b>私です</b>：接電話時表明「我就是本人」。"],["A","あら、こんにちは。莉莉です。","Ara, konnichiwa. Riri desu.","哦！你好。我是莉莉。","<b>〜です</b>：電話中報上自己的名字，不需說「私は」。"]]},{"name":"通話（2）","lines":[["A","もしもし、秀樹ですか？","Moshimoshi, Hideki desu ka?","喂，請問是秀樹嗎？","<b>〜ですか？</b>：確認接電話者身分的簡短問法。"],["B","はい、私です。どなたですか？","Hai, watashi desu. Donata desu ka?","對，我就是。請問是哪位？","<b>どなたですか</b>：「誰ですか」的敬語形（更禮貌為「どちら様でしょうか」）。"],["A","紀之です。","Noriyuki desu.","我是紀之。","<b>紀之です</b>：只報名字，用於熟人之間。"]]},{"name":"打錯電話","lines":[["A","もしもし。山本さんいらっしゃいますか。","Moshimoshi. Yamamoto-san irasshaimasu ka.","喂，請問山本先生在嗎？","<b>いらっしゃいますか</b>：「いますか」的尊敬語，詢問對方是否在。"],["B","失礼ですが、間違い電話のようです。","Shitsurei desu ga, machigai denwa no yō desu.
