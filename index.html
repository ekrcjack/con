","對不起，你打錯電話號碼了。","<b>〜のようです</b>：委婉的推測，避免直接說「你打錯了」。"],["A","ああ、すみません。","Ā, sumimasen.","哦！對不起。","<b>ああ、すみません</b>：發現自己失誤時的道歉。"]]},{"name":"留言（1）","lines":[["A","もしもし。こちらは中村真一郎です。鉄平と話をしたいのですが。","Moshimoshi. Kochira wa Nakamura Shinichirō desu. Teppei to hanashi wo shitai no desu ga.","喂，我是中村真一郎，我想找鐵平講話。","<b>こちらは〜です</b>：電話中自報身分的鄭重說法。<b>〜と話をしたいのですが</b>：對象用と，句尾留白。"],["B","すみませんね、真一郎。鉄平はここにいないんです。ことづけはありますか？","Sumimasen ne, Shinichirō. Teppei wa koko ni inai n desu. Kotozuke wa arimasu ka?","真不好意思！真一郎。鐵平現在不在這裡，你有什麼話要轉告嗎？","<b>ことづけ</b>＝留言。<b>いないんです</b>：のです說明狀況。"],["A","ええ。私に電話をくれるように彼に伝えてください。","Ē. Watashi ni denwa wo kureru yō ni kare ni tsutaete kudasai.","好的，請轉告他，請他打電話給我。","<b>〜ように伝えてください</b>：ように用於間接引述請求或命令的內容。"]]},{"name":"轉接（1）","lines":[["A","もしもし。木村さんですか？","Moshimoshi. Kimura-san desu ka?","喂，請問是木村先生嗎？","<b>〜さんですか</b>：確認對方身分。"],["B","いいえ。少々お待ちください。","Iie. Shōshō omachi kudasai.","不是的，請稍待一下。","<b>少々お待ちください</b>：「少々」比「ちょっと」正式，商務電話的標準用語。"]]},{"name":"留言（2）","lines":[["A","もしもし。こちらは鈴木純です。中井さんと話をしたいのですが。","Moshimoshi. Kochira wa Suzuki Jun desu. Nakai-san to hanashi wo shitai no desu ga.","喂，我是鈴木純。我想和中井先生講話。","<b>こちらは〜です</b>＋<b>〜と話をしたいのですが</b>：商務電話的標準開場組合。"],["B","ちょっとお待ちください。もしもし。すみませんが、中井は会議中です。こちらから電話を差し上げいただきますでしょうか。","Chotto omachi kudasai. Moshimoshi. Sumimasen ga, Nakai wa kaigi-chū desu. Kochira kara denwa wo sashiage itadakimasu deshō ka.","請等一下。喂，對不起，中井正在開會，等一下請他打電話給你好嗎？","<b>中井は</b>：對外提到自家人時不加「さん」。<b>差し上げる</b>：「あげる」的謙讓語。"],["A","はい。私の電話番号は483-2265です。","Hai. Watashi no denwa bangō wa yon-hachi-san no ni-ni-roku-go desu.","好的，我的電話號碼是483-2265。","<b>電話番号は〜です</b>：號碼中的「-」讀作「の」。"]]},{"name":"外出","lines":[["A","もしもし。こちらは俊彦です。祐二と話をしたいのですが。","Moshimoshi. Kochira wa Toshihiko desu. Yūji to hanashi wo shitai no desu ga.","喂，我是俊彥。請問裕二在嗎？","<b>こちらは〜です</b>：報上自己的名字後再說明來意。"],["B","すみません。彼は今出かけています。あとでまた電話してくださいますか？","Sumimasen. Kare wa ima dekakete imasu. Ato de mata denwa shite kudasaimasu ka?","對不起，他現在外出不在家，晚點請再打來好嗎？","<b>出かけています</b>：ている表外出中的狀態。<b>〜てくださいますか</b>為敬語請求。"],["A","わかりました。","Wakarimashita.","好的。","<b>わかりました</b>：接受對方的說明。"]]},{"name":"通話中","lines":[["A","もしもし。加藤さんをお願いします。","Moshimoshi. Katō-san wo onegai shimasu.","喂，請問加藤在嗎？","<b>〜をお願いします</b>：請對方轉接的簡潔說法。"],["B","すみません、彼は今電話中です。どちら様でしょうか？","Sumimasen, kare wa ima denwa-chū desu. Dochira-sama deshō ka?","對不起，他現在講電話中。請問是哪位？","<b>電話中</b>：名詞＋中，表正在進行。<b>どちら様でしょうか</b>是問對方身分最禮貌的說法。"],["A","斎藤圭子です。電話は長くなりそうですか？","Saitō Keiko desu. Denwa wa nagaku narisō desu ka?","我是齊藤圭子。電話會很久嗎？","<b>長くなりそう</b>：い形副詞形＋なる＋そう，推測「似乎會變長」。"],["B","圭子さん、すぐ終わると思います。ちょっとそのままお待ちいただけますか？","Keiko-san, sugu owaru to omoimasu. Chotto sono mama omachi itadakemasu ka?","圭子小姐，應該快講完了。可以稍等一下嗎？","<b>そのまま</b>＝保持原狀（不掛斷）。<b>お待ちいただけますか</b>為最客氣的等待請求。"],["A","はい。ありがとうございます。","Hai. Arigatō gozaimasu.","好的，謝謝你。","<b>はい。ありがとうございます</b>：接受安排並道謝。"]]},{"name":"初次通話（1）","lines":[["A","もしもし。","Moshimoshi.","喂。","<b>もしもし</b>：接電話的第一句，日本家庭通常不先報姓名。"],["B","もしもし。前田さんのお宅ですか？","Moshimoshi. Maeda-san no otaku desu ka?","喂，請問是前田先生家嗎？","<b>お宅</b>：「家」的尊敬語，用於詢問對方的住家。"],["A","はい。前田です。","Hai. Maeda desu.","是的，我是前田。","<b>前田です</b>：只說姓氏，是家庭電話的標準回應。"]]},{"name":"初次通話（2）","lines":[["A","木村ですが。","Kimura desu ga.","我姓木村。","<b>木村ですが</b>：報上姓氏後用<b>が</b>留白，等待對方接話。"],["B","木村さんはいらっしゃいますか？伊藤健一です。","Kimura-san wa irasshaimasu ka? Itō Kenichi desu.","木村先生在嗎？我是伊藤健一。","<b>いらっしゃいますか</b>：尊敬語詢問。先問人再報自己名字的順序在此為口語常見。"],["A","はい、おります。ちょっとお待ちください。","Hai, orimasu. Chotto omachi kudasai.","在，請稍等一下。","<b>おります</b>：「いる」的謙讓語，用於自家人。"]]},{"name":"預約","lines":[["A","安藤病院です。おはようございます。","Andō byōin desu. Ohayō gozaimasu.","安藤醫院。早安。","接電話先報單位名稱，是日本商務電話的基本禮儀。"],["B","もしもし。菊池忍と申します。きょう予約ができますか？","Moshimoshi. Kikuchi Shinobu to mōshimasu. Kyō yoyaku ga dekimasu ka?","喂，我叫菊池忍。今天可以預約嗎？","<b>〜と申します</b>：謙讓語自我介紹。<b>予約ができますか</b>：名詞＋ができる表可能。"],["A","そうですね。今日の午後2時15分でいかがでしょうか？","Sō desu ne. Kyō no gogo ni-ji jūgo-fun de ikaga deshō ka?","嗯，今天下午2點15分如何？","<b>〜でいかがでしょうか</b>：<b>で</b>表提案的條件，「いかが」是「どう」的敬語。"],["B","はい。ありがとうございます。","Hai. Arigatō gozaimasu.","好的，謝謝你。","<b>はい。ありがとうございます</b>：接受提議並道謝。"]]}]},"22":{"title":"改變話題時","jp_title":"話題を変える時","theme":"轉換話題、改變討論方向","scenes":[{"name":"轉話題（烤肉）","lines":[["A","先週末は手伝ってくれてどうもありがとう。","Senshūmatsu wa tetsudatte kurete dōmo arigatō.","上週末多謝你幫忙。","<b>〜てくれてありがとう</b>：て形說明道謝的具體內容。"],["B","どういたしまして。できて嬉しかったです。","Dō itashimashite. Dekite ureshikatta desu.","不客氣。能夠幫上忙我也很高興。","<b>できて嬉しかった</b>：可能形的て形表原因＋感情形容詞的過去式。"],["A","ところで、8日にバーベキューをするのですが。あなたと圭子は一緒に来ない？","Tokoro de, yōka ni bābekyū wo suru no desu ga. Anata to Keiko wa issho ni konai?","對了！我們8號要烤肉，你和圭子要不要一起來？","<b>ところで</b>：轉換話題最標準的接續詞。<b>来ない？</b>否定疑問的邀約。"],["B","いいね。行きます。","Ii ne. Ikimasu.","好啊，我們會去。","<b>いいね</b>表贊同，<b>行きます</b>明確答應。"]]},{"name":"轉話題（正經事）","lines":[["A","冗談をやめて、どうしても手伝ってほしいことがあります。土曜日の朝に2時間をあけてもらえませんか？","Jōdan wo yamete, dō shite mo tetsudatte hoshii koto ga arimasu. Doyōbi no asa ni ni-jikan wo akete moraemasen ka?","嗯…玩笑說到此。我需要幫忙。可否撥給我禮拜六早上兩個鐘頭的時間？","<b>冗談をやめて</b>：て形連接，「不開玩笑了」。<b>どうしても</b>＝無論如何。<b>〜てほしいこと</b>：てほしい修飾名詞。"],["B","今週の土曜日？いいですよ。","Konshū no doyōbi? Ii desu yo.","這禮拜六？可以。","<b>今週の土曜日？</b>：只重複關鍵詞加升調，即可表達確認。"]]},{"name":"轉話題（提案通過）","lines":[["A","ねえ、主任が僕の提案を認めてくれました。","Nē, shunin ga boku no teian wo mitomete kuremashita.","喂，老闆認同我的提案了。","<b>ねえ</b>：喚起注意。<b>認めてくれました</b>：てくれる表對方的行為使自己受益。"],["B","おめでとう！そうだ、話が変わるけど、きょう片岡太郎に会った？","Omedetō! Sō da, hanashi ga kawaru kedo, kyō Kataoka Tarō ni atta?","恭喜你！對了，換個話題。今天和片岡太郎見了面沒有？","<b>そうだ</b>：突然想起某事。<b>話が変わるけど</b>：明示要換話題的緩衝語。"]]},{"name":"轉話題（正經談話）","lines":[["A","その問題は春男が専門ですが、彼は今日外出しています。","Sono mondai wa Haruo ga senmon desu ga, kare wa kyō gaishutsu shite imasu.","那些問題是春男的專長，但他今天外出不在。","<b>〜が専門です</b>：<b>が</b>提示主題的內容。<b>ています</b>表目前的狀態。"],["B","あの、正直に言いますと、あなたと話をしたかったのです。ちょっと時間をいただけますか？","Ano, shōjiki ni iimasu to, anata to hanashi wo shitakatta no desu. Chotto jikan wo itadakemasu ka?","嗯，老實說，希望能跟你談一談。可以打擾你一下嗎？","<b>正直に言いますと</b>：<b>と</b>表前提「老實說的話」。<b>時間をいただけますか</b>為客氣的請求。"],["A","いいですよ。","Ii desu yo.","當然可以。","<b>いいですよ</b>：爽快答應。"]]},{"name":"轉話題（演唱會）","lines":[["A","高校の劇公演のときに会えますね？","Kōkō no geki kōen no toki ni aemasu ne?","高中話劇公演時你會來吧？","<b>〜ときに</b>：時間點的名詞子句。<b>会えますね</b>：可能形＋ね，確認對方會出席。"],["B","必ず行きます。そうだ、チャリティーコンサートに興味ある。","Kanarazu ikimasu. Sō da, charitī konsāto ni kyōmi aru.","我一定不會錯過的，那倒提醒我，你是否對慈善演唱會有興趣？","<b>必ず</b>與意志表現呼應。<b>そうだ</b>用來自然帶出新話題。"],["A","うん、行きます。","Un, ikimasu.","好啊！我要去。","<b>うん、行きます</b>：常體應答＋禮貌形回答，口語中混用很常見。"]]},{"name":"轉話題（鞋子）","lines":[["A","素晴らしい旅行でしたね。家族を連れて行くといいわね。","Subarashii ryokō deshita ne. Kazoku wo tsurete iku to ii wa ne.","真的是很棒的旅行耶！你該帶家人去的。","<b>〜といいわね</b>：條件形と＋いい，柔和地提出建議。<b>連れて行く</b>＝帶（人）去。"],["B","ええ、そうだね。で、この前の日曜日にはいていたきれいな靴はどこで買ったの？","Ē, sō da ne. De, kono mae no nichiyōbi ni haite ita kirei na kutsu wa doko de katta no?","嗯！我也這樣想。對了！上禮拜天你穿的鞋子很漂亮，在哪裡買的？","<b>で</b>：「それで」的省略，轉換話題。<b>はいていた</b>：ている的過去式修飾名詞（穿著的狀態）。"],["A","いい靴でしょう。デパートで見つけたの。","Ii kutsu deshō. Depāto de mitsuketa no.","很好看吧？在百貨公司找到的。","<b>〜でしょう</b>：升調徵求同意。<b>見つけたの</b>：の為女性的說明語氣。"]]}]},"23":{"title":"方便接話","jp_title":"会話を進んでいく時の言い方","theme":"自然接話、銜接對話","scenes":[{"name":"想一想（1）","lines":[["A","どのようにして奨学金をもらったらいいのかわかる？","Dono yō ni shite shōgakukin wo morattara ii no ka wakaru?","你知不知道要怎樣才能拿到獎學金？","<b>どのようにして</b>＝以什麼方式。<b>〜たらいいのかわかる？</b>：條件形＋いい嵌入疑問子句。"],["B","うーん、そうね。","Ūn, sō ne.","嗯……我想想看。","<b>うーん、そうね</b>：思考時的填補語，爭取時間用。"]]},{"name":"想一想（2）","lines":[["A","パーティーには何人参加したの？","Pātī ni wa nannin sanka shita no?","有多少人參加舞會？","<b>何人</b>：疑問詞＋人的量詞。<b>参加したの？</b>常體疑問。"],["B","ええと。15人ぐらいだと思うよ。","Ēto. Jūgo-nin gurai da to omou yo.","嗯……我想想看，大概有15個人。","<b>ええと</b>：想不出來時的填補詞。<b>ぐらい</b>接數量表大約。"]]},{"name":"接話（1）","lines":[["A","箱根には1回行ったことがあります。","Hakone ni wa ikkai itta koto ga arimasu.","我去過箱根一次。","<b>〜たことがあります</b>：表經驗。<b>1回</b>：次數的量詞。"],["B","ああ、そうですか。それは知りませんでした。いつそこに行きましたか？","Ā, sō desu ka. Sore wa shirimasen deshita. Itsu soko ni ikimashita ka?","喔！真的。我不知道耶，你什麼時候去的？","<b>それは知りませんでした</b>：得知新資訊時的自然回應，過去式表「（原本）不知道」。"]]},{"name":"接話（2）","lines":[["A","きのう軽井沢に行きました。","Kinō Karuizawa ni ikimashita.","我昨天去了輕井澤。","<b>きのう〜に行きました</b>：目的地用に，過去式陳述事實。"],["B","へえ、そうですか。いかがでしたか？","Hē, sō desu ka. Ikaga deshita ka?","喔，是這樣啊？你覺得怎樣？","<b>へえ</b>：表意外的感嘆詞。<b>いかがでしたか</b>：「どうでしたか」的敬語形。"]]},{"name":"接話（名人）","lines":[["A","宮澤首相は、私が話をしたことのあるただ1人の有名人です。","Miyazawa shushō wa, watashi ga hanashi wo shita koto no aru tada hitori no yūmeijin desu.","宮澤首相是我唯一交談過的名人。","<b>私が話をしたことのある</b>：經驗表現修飾名詞時，「ことがある」的が要改成<b>の</b>。"],["B","まさか！本当の話なの？彼はどんな人ですか？","Masaka! Hontō no hanashi na no? Kare wa donna hito desu ka?","不是開玩笑吧？你真的和他講過話？他人怎麼樣？","<b>まさか！</b>：表難以置信。<b>どんな人ですか</b>：詢問人的性格、特質。"]]},{"name":"接話（過夜）","lines":[["A","当日往復なら、ちょっと疲れるでしょう。","Tōjitsu ōfuku nara, chotto tsukareru deshō.","當天往返的話，會很累吧！","<b>〜なら</b>：接名詞表「若是〜的話」，承接對方的話題再做判斷。"],["B","そうだね。じゃあ、夜はどこに泊ったらいいかな？","Sō da ne. Jā, yoru wa doko ni tomattara ii ka na?","也對，那你想我們應該在哪裡過夜？","<b>〜たらいいかな</b>：條件形＋いい＋かな，半自問地徵詢意見。"]]},{"name":"接話（申請）","lines":[["A","申請すれば許可がもらえるんじゃないかな。","Shinsei sureba kyoka ga moraeru n ja nai ka na.","假如我們提出申請的話，應該可以獲得許可吧！","<b>〜すれば</b>假定形。<b>〜んじゃないかな</b>：「のではないか」的口語，表委婉的推測。"],["B","でも問題は誰か申請しますか。","Demo mondai wa dare ka shinsei shimasu ka.","可是那要誰去申請呢？","<b>問題は〜</b>：<b>は</b>提示主題，帶出癥結所在。"]]},{"name":"接話（休假）","lines":[["A","有給休暇をとりたいですが。","Yūkyū kyūka wo toritai desu ga.","我想要請年假。","<b>〜たいですが</b>：說出希望後用が留白，等待對方回應。"],["B","まぁ、いつも仕事頑張っていますから、取れるでしょう。","Mā, itsumo shigoto ganbatte imasu kara, toreru deshō.","平常你很認真工作，應該請得到吧！","<b>から</b>表理由。<b>取れるでしょう</b>：可能形＋でしょう，表推測。"]]},{"name":"接話（棒球）","lines":[["A","僕の友達はみんなジャイアンツを応援してるけど、僕は阪神タイガースのファンなんだ。","Boku no tomodachi wa minna Jaiantsu wo ōen shiteru kedo, boku wa Hanshin Taigāsu no fan nan da.","我所有的朋友都是巨人隊的球迷，只有我是阪神老虎隊的球迷。","<b>応援してる</b>：「している」的縮約。<b>けど</b>表對比，<b>なんだ</b>強調自己的情況。"],["B","それは驚きだ！僕もそうだよ。今年、優勝すると思う？","Sore wa odoroki da! Boku mo sō da yo. Kotoshi, yūshō suru to omou?","真的！我也是。你覺得他們今年會得冠軍嗎？","<b>僕もそうだよ</b>：用「そう」代替重複的內容。<b>〜と思う？</b>詢問對方的預測。"]]},{"name":"接話（休學）","lines":[["A","学校をやめるつもり？","Gakkō wo yameru tsumori?","你打算休學？","<b>〜つもり？</b>：省略「ですか」，直接以名詞升調確認對方的打算。"],["B","いや、そういうわけではありません。私の言いたかったのは、学校を続けながら働きたいと考えてるの。","Iya, sō iu wake de wa arimasen. Watashi no iitakatta no wa, gakkō wo tsuzukenagara hatarakitai to kangaeteru no.","不，我不是這個意思。我是想要一面唸書一面工作。","<b>そういうわけではありません</b>：部分否定「不是那個意思」。<b>〜ながら</b>：ます形＋ながら表同時進行。"],["A","ああ、アルバイトをするということですか。","Ā, arubaito wo suru to iu koto desu ka.","喔，你是說打工啊！","<b>〜ということですか</b>：把對方的話換句話說，確認理解是否正確。"]]}]}};
const synth = window.speechSynthesis;
let jpVoice = null;
function pickVoice(){
  const vs = synth.getVoices();
  jpVoice = vs.find(v=>v.lang==='ja-JP') || vs.find(v=>v.lang && v.lang.startsWith('ja')) || null;
}
pickVoice();
if(synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;

let curBtn = null;
let playingScene = false;
let _keepAlive = null;  // Chrome長句保活計時器

function stopAll(){
  synth.cancel();
  if(_keepAlive){ clearInterval(_keepAlive); _keepAlive=null; }
  playingScene=false;
  if(curBtn){curBtn.classList.remove('playing');curBtn.textContent='🔊';curBtn=null;}
  document.querySelectorAll('.play').forEach(b=>{b.classList.remove('playing');b.textContent='🔊';});
}

function speak(text, btn, onend){
  // 先停止舊的
  if(_keepAlive){ clearInterval(_keepAlive); _keepAlive=null; }
  synth.cancel();
  if(curBtn && curBtn!==btn){curBtn.classList.remove('playing');curBtn.textContent='🔊';}

  // cancel()需要一點時間才真正生效，延遲80ms再播
  setTimeout(()=>{
    const rate = parseFloat(document.getElementById('speed').value);
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = rate;       // 0.5 ~ 1.3
    u.pitch = 1;
    u.volume = 1;
    if(jpVoice) u.voice = jpVoice;

    if(btn){btn.classList.add('playing');btn.textContent='⏸';curBtn=btn;}

    // Chrome 有個已知 bug：長句播到約15秒會自動停住
    // 用 setInterval 每10秒 resume() 來保活
    u.onstart = ()=>{
      _keepAlive = setInterval(()=>{
        if(synth.speaking && !synth.paused) {
          synth.pause();
          synth.resume();
        }
      }, 10000);
    };

    u.onend = ()=>{
      if(_keepAlive){clearInterval(_keepAlive);_keepAlive=null;}
      if(btn){btn.classList.remove('playing');btn.textContent='🔊';}
      if(curBtn===btn) curBtn=null;
      if(onend) onend();
    };
    u.onerror = (e)=>{
      if(_keepAlive){clearInterval(_keepAlive);_keepAlive=null;}
      if(btn){btn.classList.remove('playing');btn.textContent='🔊';}
      if(onend) onend();
    };

    synth.speak(u);
  }, 80);
}

function playScene(lines, btns, i){
  if(i>=lines.length){playingScene=false;return;}
  playingScene=true;
  speak(lines[i], btns[i], ()=>{ if(playingScene) setTimeout(()=>playScene(lines,btns,i+1),350); });
}

function renderSidebar(){
  const sb=document.getElementById('sidebar');
  Object.keys(DATA).forEach(k=>{
    const u=DATA[k];
    const b=document.createElement('button');
    b.className='unit-btn';
    b.innerHTML='<span class="unit-num">'+k+'</span><span class="unit-label">'+u.title+'</span>';
    b.onclick=()=>selectUnit(k,b);
    sb.appendChild(b);
  });
}

function selectUnit(k,btn){
  document.querySelectorAll('.unit-btn').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  stopAll();
  const u=DATA[k];
  const m=document.getElementById('main');
  let h='<div class="unit-head"><h2>單元 '+k+'　'+u.title+'</h2>'
        +'<div class="jp">'+u.jp_title+'</div>'
        +'<div class="theme">📌 '+u.theme+'</div></div>';
  u.scenes.forEach((sc,si)=>{
    h+='<div class="scene"><div class="scene-head">'
      +'<span class="scene-badge">'+(si+1)+'</span>'
      +'<span class="scene-title">'+sc.name+'</span>'
      +'<button class="scene-play" data-u="'+k+'" data-s="'+si+'">▶ 連續播放</button></div>';
    sc.lines.forEach((ln,li)=>{
      const sp=ln[0], jp=ln[1], ro=ln[2], zh=ln[3], gr=ln[4];
      h+='<div class="line">'
        +'<span class="spk '+sp+'">'+sp+'</span>'
        +'<div class="line-body">'
        +'<div class="jp-row"><span class="jp-text">'+jp+'</span>'
        +'<button class="play" data-jp="'+encodeURIComponent(jp)+'" data-u="'+k+'" data-s="'+si+'" data-l="'+li+'">🔊</button></div>'
        +'<div class="romaji">'+ro+'</div>'
        +'<div class="zh">'+zh+'</div>'
        +(gr?'<div class="gram">'+gr+'</div>':'')
        +'</div></div>';
    });
    h+='</div>';
  });
  m.innerHTML=h;
  m.scrollTop=0;
  // 綁定單句
  m.querySelectorAll('.play').forEach(btn=>{
    btn.onclick=e=>{e.stopPropagation();playingScene=false;speak(decodeURIComponent(btn.dataset.jp),btn);};
  });
  // 綁定場景連播
  m.querySelectorAll('.scene-play').forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const ui=btn.dataset.u, si=+btn.dataset.s;
      const sc=DATA[ui].scenes[si];
      const lines=sc.lines.map(l=>l[1]);
      const sceneEl=btn.closest('.scene');
      const btns=[...sceneEl.querySelectorAll('.play')];
      stopAll();
      playingScene=true;
      setTimeout(()=>playScene(lines,btns,0), 150);
    };
  });
}

document.getElementById('speed').oninput=e=>{
  document.getElementById('speedVal').textContent=parseFloat(e.target.value).toFixed(1)+'x';
};
document.getElementById('stopBtn').onclick=()=>{ stopAll(); };

renderSidebar();
selectUnit('1',document.querySelector('.unit-btn'));
</script>
</body>
</html>
