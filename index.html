<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活日語會話一本搞定 - 互動學習工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: flex;
            min-height: 600px;
        }

        .sidebar {
            width: 250px;
            background: #f8f9fa;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            padding: 20px 0;
        }

        .unit-btn {
            display: block;
            width: 100%;
            padding: 12px 20px;
            text-align: left;
            border: none;
            background: transparent;
            color: #333;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
            font-size: 0.95em;
        }

        .unit-btn:hover {
            background: #e8e8e8;
            border-left-color: #667eea;
        }

        .unit-btn.active {
            background: #667eea;
            color: white;
            border-left-color: #667eea;
            font-weight: 600;
        }

        .main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .unit-title {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .unit-theme {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .scene {
            margin-bottom: 40px;
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .scene-title {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .dialogue-block {
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #764ba2;
        }

        .speaker {
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.05em;
        }

        .dialogue-line {
            margin-bottom: 15px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .dialogue-line:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .lang-label {
            display: inline-block;
            font-size: 0.8em;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            margin-right: 10px;
            margin-bottom: 5px;
        }

        .text-content {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .text-content.japanese {
            font-size: 1.1em;
            color: #333;
            font-weight: 500;
        }

        .text-content.romaji {
            font-size: 0.95em;
            color: #666;
            font-style: italic;
        }

        .text-content.chinese {
            font-size: 1em;
            color: #555;
        }

        .sound-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .sound-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .sound-btn:active {
            transform: translateY(0);
        }

        .sound-btn.playing {
            background: #ff6b6b;
        }

        .sound-btn::before {
            content: "🔊";
        }

        .sound-btn.playing::before {
            content: "⏸";
        }

        .speaker-label {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9em;
            margin-right: 10px;
            min-width: 40px;
            text-align: center;
        }

        .speaker-label.B {
            background: #764ba2;
        }

        .speaker-label.C {
            background: #ff6b6b;
        }

        .controls {
            position: sticky;
            bottom: 20px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .speed-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .speed-control label {
            font-weight: 600;
            color: #333;
        }

        .speed-control input[type="range"] {
            width: 150px;
        }

        .control-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin: 0 10px;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #333;
        }

        .info-box strong {
            color: #667eea;
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 5px;
                padding: 10px;
            }

            .unit-btn {
                padding: 8px 10px;
                font-size: 0.85em;
            }

            .main {
                padding: 20px;
            }

            .unit-title {
                font-size: 1.5em;
            }

            .header h1 {
                font-size: 1.5em;
            }
        }

        .scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #667eea #f0f0f0;
        }

        .scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar::-webkit-scrollbar-track {
            background: #f0f0f0;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        .scrollbar::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎌 生活日語會話一本搞定</h1>
            <p>按🔊按鈕聽發音 | 互動式日語學習工具</p>
        </div>

        <div class="content">
            <div class="sidebar scrollbar" id="sidebar"></div>
            <div class="main scrollbar">
                <div id="content-area"></div>
            </div>
        </div>

        <div class="controls">
            <div class="speed-control">
                <label>發音速度：</label>
                <input type="range" id="speedControl" min="0.5" max="2" step="0.1" value="1">
                <span id="speedValue">1x</span>
            </div>
            <button class="control-btn" id="stopBtn">⏹ 停止發音</button>
            <button class="control-btn" id="resetBtn">🔄 重置</button>
        </div>
    </div>

                        name: "場景2：電影愛好",
                        lines: [
                            { speaker: "A", japanese: "映画は好きですか？", romaji: "Eiga wa suki desu ka?", chinese: "你喜歡看電影嗎?" },
                            { speaker: "B", japanese: "大好きです。毎週映画館に見に行きます。", romaji: "Dai-suki desu. Mai-shū eigakan ni mi ni ikimasu.", chinese: "我最喜歡看電影。每個禮拜都會去電影院看。" },
                            { speaker: "A", japanese: "いいですね。でも、私は家で見ることが多いです。", romaji: "Ii desu ne. Demo, watashi wa ie de miru koto ga ōi desu.", chinese: "真好啊！不過我都在家襄看錄影帶。" }
                        ]
                    },
                    {
                        name: "場景3：食物偏好比較",
                        lines: [
                            { speaker: "A", japanese: "テニスより、スキーの方が好きです。", romaji: "Tenisu yori, sukī no hō ga suki desu.", chinese: "比起網球，我比較喜歡滑雪。" },
                            { speaker: "B", japanese: "私は肉料理の方が好きです。", romaji: "Watashi wa niku ryōri no hō ga suki desu.", chinese: "我喜歡吃肉。" },
                            { speaker: "A", japanese: "私はシチリア料理は好きじゃありません。辛すぎます。", romaji: "Watashi wa Shichilia ryōri wa suki ja arimasen. Karasugimasu.", chinese: "我不喜歡墨西哥菜。太辣了。" }
                        ]
                    }
                ]
            }
        };

        let synth = window.speechSynthesis;
        let currentUtterance = null;

        // 初始化
        function init() {
            renderSidebar();
            selectUnit(1);
        }

        // 渲染側欄
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';

            Object.keys(lessonData).forEach(unitNum => {
                const btn = document.createElement('button');
                btn.className = 'unit-btn';
                btn.textContent = `單元 ${unitNum}`;
                btn.onclick = () => selectUnit(unitNum);
                if (unitNum == 1) btn.classList.add('active');
                sidebar.appendChild(btn);
            });
        }

        // 選擇單元
        function selectUnit(unitNum) {
            document.querySelectorAll('.unit-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const unit = lessonData[unitNum];
            renderContent(unit);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 渲染內容
        function renderContent(unit) {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '';

            const title = document.createElement('h2');
            title.className = 'unit-title';
            title.textContent = unit.title;
            contentArea.appendChild(title);

            const theme = document.createElement('p');
            theme.className = 'unit-theme';
            theme.textContent = `📌 ${unit.theme}`;
            contentArea.appendChild(theme);

            unit.scenes.forEach(scene => {
                const sceneDiv = document.createElement('div');
                sceneDiv.className = 'scene';

                const sceneTitle = document.createElement('h3');
                sceneTitle.className = 'scene-title';
                sceneTitle.textContent = scene.name;
                sceneDiv.appendChild(sceneTitle);

                scene.lines.forEach(line => {
                    const dialogueBlock = document.createElement('div');
                    dialogueBlock.className = 'dialogue-block';

                    const speaker = document.createElement('div');
                    speaker.className = 'speaker';
                    speaker.innerHTML = `<span class="speaker-label ${line.speaker}">${line.speaker}</span>`;
                    dialogueBlock.appendChild(speaker);

                    // 日文
                    const japaneseDiv = document.createElement('div');
                    japaneseDiv.className = 'dialogue-line';
                    japaneseDiv.innerHTML = `<span class="lang-label">日文</span>`;
                    const japaneseContent = document.createElement('div');
                    japaneseContent.className = 'text-content japanese';
                    japaneseContent.textContent = line.japanese;
                    const japaneseBtn = createSoundButton(line.japanese, 'ja-JP');
                    japaneseContent.appendChild(japaneseBtn);
                    japaneseDiv.appendChild(japaneseContent);
                    dialogueBlock.appendChild(japaneseDiv);

                    // 羅馬拼音
                    const romajiDiv = document.createElement('div');
                    romajiDiv.className = 'dialogue-line';
                    romajiDiv.innerHTML = `<span class="lang-label">羅馬拼音</span>`;
                    const romajiContent = document.createElement('div');
                    romajiContent.className = 'text-content romaji';
                    romajiContent.textContent = line.romaji;
                    romajiDiv.appendChild(romajiContent);
                    dialogueBlock.appendChild(romajiDiv);

                    // 中文翻譯
                    const chineseDiv = document.createElement('div');
                    chineseDiv.className = 'dialogue-line';
                    chineseDiv.innerHTML = `<span class="lang-label">中文</span>`;
                    const chineseContent = document.createElement('div');
                    chineseContent.className = 'text-content chinese';
                    chineseContent.textContent = line.chinese;
                    const chineseBtn = createSoundButton(line.chinese, 'zh-TW');
                    chineseContent.appendChild(chineseBtn);
                    chineseDiv.appendChild(chineseContent);
                    dialogueBlock.appendChild(chineseDiv);

                    sceneDiv.appendChild(dialogueBlock);
                });

                contentArea.appendChild(sceneDiv);
            });
        }

        // 創建發音按鈕
        function createSoundButton(text, lang) {
            const btn = document.createElement('button');
            btn.className = 'sound-btn';
            btn.title = '點擊發音';
            btn.onclick = (e) => {
                e.stopPropagation();
                speakText(text, lang, btn);
            };
            return btn;
        }

        // 文字轉語音
        function speakText(text, lang, btn) {
            synth.cancel();

            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = lang;
            currentUtterance.rate = parseFloat(document.getElementById('speedControl').value);

            btn.classList.add('playing');

            currentUtterance.onend = () => {
                btn.classList.remove('playing');
            };

            synth.speak(currentUtterance);
        }

        // 速度控制
        document.getElementById('speedControl').addEventListener('input', (e) => {
            document.getElementById('speedValue').textContent = e.target.value + 'x';
        });

        // 停止按鈕
        document.getElementById('stopBtn').addEventListener('click', () => {
            synth.cancel();
            document.querySelectorAll('.sound-btn').forEach(btn => btn.classList.remove('playing'));
        });

        // 重置按鈕
        document.getElementById('resetBtn').addEventListener('click', () => {
            synth.cancel();
            document.querySelectorAll('.sound-btn').forEach(btn => btn.classList.remove('playing'));
            selectUnit(1);
        });

        // 初始化應用
        init();
    </script>
</body>
</html>
